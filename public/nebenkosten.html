<!DOCTYPE html>
<html lang="de">
<head>

<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;color:#1f2937}

.main{flex:1;margin-left:250px;transition:margin-left .3s}

.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

.content{padding:24px;max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:20px;margin-bottom:16px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:16px;display:flex;align-items:center;gap:12px}

.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
.btn-warning{background:#ea580c;color:#fff}.btn-warning:hover{background:#c2410c}
.btn-purple{background:#7c3aed;color:#fff}.btn-purple:hover{background:#6d28d9}

.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.summary-card{border-radius:12px;padding:18px;color:#fff}
.summary-card.blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}.summary-card.green{background:linear-gradient(135deg,#22c55e,#16a34a)}.summary-card.purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}.summary-card.red{background:linear-gradient(135deg,#ef4444,#dc2626)}.summary-card.emerald{background:linear-gradient(135deg,#10b981,#059669)}.summary-card.amber{background:linear-gradient(135deg,#f59e0b,#d97706)}
.summary-label{font-size:12px;opacity:.9}.summary-value{font-size:22px;font-weight:700;margin-top:4px}.summary-sub{font-size:11px;opacity:.7;margin-top:3px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.unit-card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:14px}
.unit-card.vacant{border-color:#fde047;background:#fffef5}
.unit-card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
.unit-card-info{font-size:12px;color:#6b7280;line-height:1.8}

.legal-note{background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:12px;font-size:12px;color:#6b21a8;margin-top:12px}
.settlement-table th,.settlement-table td{padding:8px 10px;font-size:12px}
.settlement-table tfoot td{font-weight:700;border-top:2px solid #e5e7eb;background:#f9fafb}
.amount-positive{color:#dc2626;font-weight:600}.amount-negative{color:#16a34a;font-weight:600}
.tab-bar{display:flex;gap:4px;border-bottom:2px solid #e5e7eb;margin-bottom:16px}
.tab-btn{padding:8px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.import-zone{border:2px dashed #d1d5db;border-radius:12px;padding:40px;text-align:center;cursor:pointer}
.import-zone:hover{border-color:#2563eb;background:#eff6ff}
.import-zone i{font-size:48px;color:#9ca3af;margin-bottom:12px;display:block}
.backup-card{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px solid #86efac}
.backup-icon{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#16a34a,#15803d);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.backup-icon i{color:#fff;font-size:28px}
.pdf-page{width:210mm;min-height:297mm;padding:20mm;margin:0 auto 20px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.1);font-size:11pt;line-height:1.5}
.pdf-letterhead{display:flex;justify-content:space-between;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #2563eb}
.pdf-letterhead-sender{font-size:9pt;color:#6b7280;line-height:1.4}
.pdf-letterhead-sender strong{color:#1f2937;font-size:11pt;display:block;margin-bottom:2px}
.pdf-letterhead-logo{text-align:right}
.pdf-letterhead-logo h1{font-size:14pt;color:#2563eb;margin-bottom:2px}
.pdf-letterhead-logo p{font-size:8pt;color:#6b7280}
.pdf-recipient{margin:20px 0 30px;padding:15px;background:#f9fafb;border-left:3px solid #2563eb}
.pdf-recipient p{font-size:11pt;line-height:1.6}
.pdf-date{text-align:right;font-size:10pt;color:#6b7280;margin-bottom:20px}
.pdf-subject{font-size:13pt;font-weight:700;margin-bottom:20px}
.pdf-section{margin-bottom:20px}
.pdf-section h2{font-size:12pt;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #e5e7eb}
.pdf-table{width:100%;border-collapse:collapse;margin-bottom:15px}
.pdf-table th{background:#f3f4f6;padding:8px 10px;text-align:left;font-size:10pt;font-weight:600;border:1px solid #e5e7eb}
.pdf-table td{padding:8px 10px;font-size:10pt;border:1px solid #e5e7eb}
.pdf-table .text-right{text-align:right}
.pdf-total-row{background:#eff6ff!important;font-weight:700}
.pdf-balance{display:flex;justify-content:space-between;align-items:center;padding:15px;border-radius:8px;margin:20px 0}
.pdf-balance.guthaben{background:#f0fdf4;border:2px solid #16a34a}
.pdf-balance.nachzahlung{background:#fef2f2;border:2px solid #dc2626}
.pdf-balance.ausgeglichen{background:#f9fafb;border:2px solid #6b7280}
.pdf-balance-label{font-size:12pt;font-weight:600}
.pdf-balance-amount{font-size:16pt;font-weight:700}
.pdf-footer{margin-top:30px;padding-top:15px;border-top:1px solid #e5e7eb;font-size:9pt;color:#6b7280}
.pdf-footer-sender{margin-top:15px;font-size:8pt;color:#9ca3af;line-height:1.4;border-top:1px solid #e5e7eb;padding-top:10px}
.pdf-signature{margin-top:40px}
.pdf-signature-line{border-top:1px solid #374151;width:200px;margin-top:40px;padding-top:5px;font-size:10pt}
.chart-bar{display:flex;align-items:end;gap:8px;height:200px;padding:20px;background:#f9fafb;border-radius:8px;margin-top:12px}
.chart-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.chart-bar-fill{width:100%;background:linear-gradient(to top,#3b82f6,#60a5fa);border-radius:4px 4px 0 0;transition:height .3s;min-height:2px}
.chart-bar-label{font-size:11px;color:#6b7280;text-align:center}
.chart-bar-value{font-size:12px;font-weight:600;color:#1f2937}
@media print{.sidebar,.topbar,.btn,.no-print,.nav-section{display:none!important}.main{margin-left:0!important}.content{padding:0;max-width:100%}.card{box-shadow:none;border:none}body{background:#fff}.pdf-page{box-shadow:none;margin:0;page-break-after:always}.pdf-page:last-child{page-break-after:auto}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0!important}.form-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.pdf-page{width:100%;padding:10mm}}
</style>

<body>
<div id="app"></div>
<script>
const SK='nk_v8',AV='3.0';
function ld(){try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r)}catch(e){}return{property:null,units:[],tenants:[],costs:[],customDistKeys:[],prepayments:[],consumptions:[],letters:[]}}
function sd(d){localStorage.setItem(SK,JSON.stringify(d))}
let S=ld(),tab='dashboard',sc=false,mc=null,pv=null;
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2)}
function fc(a){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(a)}
function fd(d){return d?new Date(d).toLocaleDateString('de-DE'):'—'}
const CC={heating:{l:'Heizung',b:true,h:true},hot_water:{l:'Warmwasser',b:true,h:true},water:{l:'Kaltwasser',b:true},sewage:{l:'Abwasser',b:true},garbage:{l:'Müllabfuhr',b:true},electricity_common:{l:'Allgemeinstrom',b:true},insurance:{l:'Versicherungen',b:true},maintenance:{l:'Instandhaltung',b:false},property_tax:{l:'Grundsteuer',b:true},cleaning:{l:'Reinigung',b:true},gardening:{l:'Gartenpflege',b:true},elevator:{l:'Aufzug',b:true},chimney:{l:'Schornsteinfeger',b:true},pest_control:{l:'Schädlingsbekämpfung',b:true},cable_tv:{l:'Kabel-TV',b:true},other:{l:'Sonstiges',b:true}};
const SDK={area:'Nach Wohnfläche (m²)',persons:'Nach Personenzahl',units:'Nach Wohneinheiten',consumption:'Nach Verbrauch'};
function adk(){const k={...SDK};(S.customDistKeys||[]).forEach(x=>{k[x.id]=x.name});return k}
function iuv(uid,cd){return S.tenants.filter(t=>{if(t.unitId!==uid)return false;const d=new Date(cd),mi=new Date(t.moveInDate),mo=t.moveOutDate?new Date(t.moveOutDate):null;if(mo&&d>mo)return false;if(d<mi)return false;return true}).length===0}
function cp(tid,y){const ps=S.prepayments.filter(p=>p.tenantId===tid);if(!ps.length)return 0;const ys=new Date(y+'-01-01'),ye=new Date(y+'-12-31');let t=0;for(const p of ps){const sd2=new Date(p.startDate),ed=p.endDate?new Date(p.endDate):ye,es=sd2>ys?sd2:ys,ee=ed<ye?ed:ye;if(es>ee)continue;t+=p.monthlyAmount*((ee.getFullYear()-es.getFullYear())*12+ee.getMonth()-es.getMonth()+1)}return t}

// HEIZKOSTENV BERECHNUNG
function hkvCalc(year){const heatingCosts=S.costs.filter(c=>(c.category==='heating'||c.category==='hot_water')&&new Date(c.date).getFullYear().toString()===year);const totalHeating=heatingCosts.reduce((s,c)=>s+c.amount,0);const consumptions=S.consumptions.filter(c=>c.year.toString()===year);if(!consumptions.length||!totalHeating)return null;const totalConsumption=consumptions.reduce((s,c)=>s+c.value,0);const result={};consumptions.forEach(c=>{const share=totalConsumption>0?c.value/totalConsumption:0;const consumptionPart=totalHeating*0.7*share;const areaPart=totalHeating*0.3*(S.units.find(u=>u.id===c.unitId)?.size||0)/S.units.reduce((s,u)=>s+u.size,0);const tenant=S.tenants.find(t=>t.unitId===c.unitId);if(tenant){if(!result[tenant.id])result[tenant.id]={total:0,consumption:0,area:0};result[tenant.id].total+=consumptionPart+areaPart;result[tenant.id].consumption+=consumptionPart;result[tenant.id].area+=areaPart}});return{total:totalHeating,consumption:totalHeating*0.7,area:totalHeating*0.3,byTenant:result,consumptions}}
function cs(y){const fc2=S.costs.filter(c=>new Date(c.date).getFullYear().toString()===y),ul=fc2.filter(c=>CC[c.category]?.b!==false),nu=fc2.filter(c=>CC[c.category]?.b===false);let vc=0,oc=0;const ds=[];const hkv=hkvCalc(y);for(const cost of ul){if(cost.category==='heating'||cost.category==='hot_water'){if(hkv){Object.entries(hkv.byTenant).forEach(([tid,data])=>{const tenant=S.tenants.find(t=>t.id===tid);if(!tenant)return;const unit=S.units.find(u=>u.id===tenant.unitId);ds.push({tenantId:tid,tenantName:tenant.name,unitId:unit.id,unitName:unit.name,category:cost.category,amount:Math.round(data.total*100)/100,share:0})});oc+=cost.amount}continue}const ou=S.units.filter(u=>!iuv(u.id,cost.date));if(!ou.length){vc+=cost.amount;continue}const oa=ou.reduce((s,u)=>s+u.size,0),ta=S.units.reduce((s,u)=>s+u.size,0),os=cost.distributionKey==='area'?oa/ta:1,uf=cost.amount*os;vc+=(cost.amount-uf);oc+=uf;const ts=S.tenants.filter(t=>{const u=S.units.find(x=>x.id===t.unitId);if(!u)return false;const d=new Date(cost.date),mi=new Date(t.moveInDate),mo=t.moveOutDate?new Date(t.moveOutDate):null;if(mo&&d>mo)return false;if(d<mi)return false;return true});let tw=0;for(const t of ts){const u=S.units.find(x=>x.id===t.unitId);if(!u)continue;tw+=cost.distributionKey==='area'?u.size:1}if(!tw)continue;for(const t of ts){const u=S.units.find(x=>x.id===t.unitId);if(!u)continue;const w=cost.distributionKey==='area'?u.size:1,sh=w/tw;ds.push({tenantId:t.id,tenantName:t.name,unitId:u.id,unitName:u.name,category:cost.category,amount:Math.round(uf*sh*100)/100,share:Math.round(sh*10000)/100})}}const vu=S.units.filter(u=>!S.tenants.some(t=>{if(t.unitId!==u.id)return false;const n=new Date(y+'-12-31'),ys=new Date(y+'-01-01'),mi=new Date(t.moveInDate),mo=t.moveOutDate?new Date(t.moveOutDate):null;if(mo&&ys>mo)return false;if(mi>n)return false;return true}));const bc={};ul.forEach(c=>{bc[c.category]=(bc[c.category]||0)+c.amount});return{tc:fc2.reduce((s,c)=>s+c.amount,0),ut:ul.reduce((s,c)=>s+c.amount,0),nu:nu.reduce((s,c)=>s+c.amount,0),vc,oc,ds,vu,bc}}
function gts(tid,y){const r=cs(y),td=r.ds.filter(d=>d.tenantId===tid),t=td.reduce((s,d)=>s+d.amount,0),c={};td.forEach(d=>{c[d.category]=(c[d.category]||0)+d.amount});const p=cp(tid,y);return{total:t,categories:c,prepayments:p,balance:p-t}}
function exportBackup(){const b={v:AV,d:new Date().toISOString(),app:'Nebenkostenabrechnung',S};const j=JSON.stringify(b,null,2),bl=new Blob([j],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a'),dt=new Date().toISOString().split('T')[0],pn=(S.property?.name||'Nebenkosten').replace(/[^a-zA-Z0-9äöüÄÖÜß\-_]/g,'_');a.href=u;a.download=`Nebenkosten_Backup_${pn}_${dt}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);localStorage.setItem('lastBackup',new Date().toISOString());alert('✅ Backup erstellt!')}
function importBackup(file){const r=new FileReader();r.onload=e=>{try{const b=JSON.parse(e.target.result);if(!b.data)throw new Error('Keine Daten');if(!confirm('Backup importieren? Aktuelle Daten werden überschrieben!'))return;S=b.data;sd(S);alert('✅ Import erfolgreich!');location.reload()}catch(err){alert('❌ Fehler: '+err.message)}};r.readAsText(file)}
function lbi(){const lb=localStorage.getItem('lastBackup');return lb?new Date(lb):null}

function render(){document.getElementById('app').innerHTML=`<div class="app">${rSidebar()}<div class="main ${sc?'expanded':''}">${rTopbar()}<div class="content">${rContent()}</div></div></div>${mc?`<div class="modal-overlay" id="mo"><div class="modal">${mc}</div></div>`:''}`;ae()}
function rSidebar(){const items=[{s:'Übersicht',t:[{id:'dashboard',l:'Dashboard',i:'fas fa-chart-line'},{id:'backup',l:'Daten & Backup',i:'fas fa-shield-alt'}]},{s:'Stammdaten',t:[{id:'property',l:'Objekt & Vermieter',i:'fas fa-home'},{id:'units',l:'Wohneinheiten',i:'fas fa-building'},{id:'tenants',l:'Mieter',i:'fas fa-users'},{id:'prepayments',l:'Vorauszahlungen',i:'fas fa-money-bill-wave'},{id:'consumptions',l:'Verbrauchsablesung',i:'fas fa-tachometer-alt'}]},{s:'Bewirtschaftung',t:[{id:'costs',l:'Kosten',i:'fas fa-receipt'},{id:'yearend',l:'Jahreswechsel',i:'fas fa-calendar-plus'},{id:'comparison',l:'Jahresvergleich',i:'fas fa-chart-bar'}]},{s:'Abrechnung',t:[{id:'settlement',l:'Abrechnung',i:'fas fa-file-invoice-dollar'},{id:'letters',l:'Mieteranschreiben',i:'fas fa-envelope'}]}];return`<aside class="sidebar ${sc?'collapsed':''}"><div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-calculator"></i></div>${!sc?`<div><div class="sidebar-title">${S.property?.name||'Nebenkosten'}</div><div class="sidebar-subtitle">Abrechnung</div></div>`:''}</div><nav class="nav">${items.map(s=>`${!sc?`<div class="nav-section">${s.s}</div>`:''}${s.t.map(t=>`<button class="nav-btn ${tab===t.id?'active':''}" data-tab="${t.id}"><i class="${t.i}"></i>${!sc?`<span>${t.l}</span>`:''}</button>`).join('')}`).join('')}</nav><div class="sidebar-footer"><button class="sidebar-toggle" id="tsb"><i class="fas fa-chevron-${sc?'right':'left'}"></i>${!sc?'<span>Einklappen</span>':''}</button></div></aside>`}
function rTopbar(){const t={dashboard:'Dashboard',backup:'Daten & Backup',property:'Objekt & Vermieter',units:'Wohneinheiten',tenants:'Mieter',prepayments:'Vorauszahlungen',consumptions:'Verbrauchsablesung',costs:'Betriebskosten',yearend:'Jahreswechsel',comparison:'Jahresvergleich',settlement:'Nebenkostenabrechnung',letters:'Mieteranschreiben'};return`<header class="topbar"><h1>${t[tab]}</h1><div class="topbar-right"><i class="fas fa-database"></i><span>Lokale Speicherung</span></div></header>`}
function rContent(){if(pv)return rPdfView();switch(tab){case'dashboard':return rDash();case'backup':return rBackup();case'property':return rProp();case'units':return rUnits();case'tenants':return rTenants();case'prepayments':return rPrepay();case'consumptions':return rConsumptions();case'costs':return rCosts();case'yearend':return rYE();case'comparison':return rComparison();case'settlement':return rSettle();case'letters':return rLetters()}}

function rDash(){const tc=S.costs.reduce((s,c)=>s+c.amount,0),ta=S.units.reduce((s,u)=>s+u.size,0),occ=S.units.filter(u=>S.tenants.some(t=>t.unitId===u.id)),vac=S.units.filter(u=>!S.tenants.some(t=>t.unitId===u.id)),cy=new Date().getFullYear(),yt=S.costs.filter(c=>new Date(c.date).getFullYear()===cy).reduce((s,c)=>s+c.amount,0),nu=S.costs.filter(c=>CC[c.category]?.b===false).reduce((s,c)=>s+c.amount,0),tp=S.prepayments.reduce((s,p)=>s+p.monthlyAmount*12,0),lb=lbi(),dsb=lb?Math.floor((new Date()-lb)/864e5):null;return`${dsb===null||dsb>30?`<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>Backup-Erinnerung:</strong> ${dsb===null?'Noch nie ein Backup erstellt!':dsb+' Tage her.'} <a href="#" onclick="tab='backup';render();return false" style="color:#1e40af;text-decoration:underline;margin-left:8px">Jetzt erstellen</a></div></div>`:''}<div class="stats-grid"><div class="stat-card"><div class="stat-icon blue"><i class="fas fa-home"></i></div><div><div class="stat-value">${S.property?'✓':'—'}</div><div class="stat-label">Objekt</div></div></div><div class="stat-card"><div class="stat-icon green"><i class="fas fa-building"></i></div><div><div class="stat-value">${S.units.length}</div><div class="stat-label">Einheiten</div></div></div><div class="stat-card"><div class="stat-icon purple"><i class="fas fa-users"></i></div><div><div class="stat-value">${S.tenants.length}</div><div class="stat-label">Mieter</div></div></div><div class="stat-card"><div class="stat-icon orange"><i class="fas fa-receipt"></i></div><div><div class="stat-value">${fc(yt)}</div><div class="stat-label">Kosten ${cy}</div></div></div></div>${nu>0?`<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i><div><strong>Nicht umlegbar: ${fc(nu)}</strong></div></div>`:''}${vac.length>0?`<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>${vac.length} Leerstand</strong></div></div>`:''}`}

function rBackup(){const lb=lbi(),ds=new Blob([JSON.stringify(S)]).size,dk=(ds/1024).toFixed(2);return`<div class="card backup-card"><div style="text-align:center;padding:20px 0"><div class="backup-icon"><i class="fas fa-shield-alt"></i></div><h2 style="font-size:24px;font-weight:700;margin-bottom:8px">Daten-Backup</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0"><div style="padding:16px;background:#fff;border-radius:12px;border:1px solid #86efac"><div style="font-size:12px;color:#6b7280">Letztes Backup</div><div style="font-size:16px;font-weight:700;color:#166534;margin-top:4px">${lb?lb.toLocaleString('de-DE'):'Noch nie'}</div></div><div style="padding:16px;background:#fff;border-radius:12px;border:1px solid #86efac"><div style="font-size:12px;color:#6b7280">Datengröße</div><div style="font-size:16px;font-weight:700;color:#166534;margin-top:4px">${dk} KB</div></div></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn btn-success btn-lg" id="expBtn"><i class="fas fa-download"></i> Backup erstellen</button><button class="btn btn-primary btn-lg" id="impBtn"><i class="fas fa-upload"></i> Backup importieren</button></div></div></div><div class="card"><h3 class="card-title">Backup importieren</h3><div class="import-zone" id="iz"><i class="fas fa-cloud-upload-alt"></i><p style="font-size:16px;font-weight:600;margin-bottom:8px">Datei hier ablegen oder klicken</p><input type="file" id="ifi" accept=".json" style="display:none"></div></div>`}

function rProp(){const p=S.property;return`<div class="card"><div class="card-header"><h2 class="card-title">Objekt & Vermieter</h2></div><div class="tab-bar no-print"><button class="tab-btn ${!window._pt||window._pt==='o'?'active':''}" onclick="window._pt='o';render()">Objektdaten</button><button class="tab-btn ${window._pt==='v'?'active':''}" onclick="window._pt='v';render()">Vermieter</button></div>${(!window._pt||window._pt==='o')?`<div class="form-grid"><div class="form-group"><label class="form-label">Objektbezeichnung <span class="req">*</span></label><input class="form-input" id="pn" value="${p?.name||''}"></div><div class="form-group full"><label class="form-label">Adresse <span class="req">*</span></label><input class="form-input" id="pa" value="${p?.address||''}"></div></div>`:`<div class="form-grid"><div class="form-group"><label class="form-label">Name <span class="req">*</span></label><input class="form-input" id="po" value="${p?.owner||''}"></div><div class="form-group full"><label class="form-label">Anschrift <span class="req">*</span></label><input class="form-input" id="poad" value="${p?.ownerAddress||''}"></div><div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="pp" value="${p?.phone||''}"></div><div class="form-group"><label class="form-label">IBAN</label><input class="form-input" id="pb" value="${p?.bank||''}"></div></div>`}<div class="form-actions"><button class="btn btn-primary" id="sp"><i class="fas fa-save"></i> Speichern</button></div></div>`}

function rUnits(){return`<div class="card"><div class="card-header"><h2 class="card-title">Wohneinheiten (${S.units.length})</h2><button class="btn btn-primary" id="aub"><i class="fas fa-plus"></i> Neu</button></div><div class="unit-grid" style="margin-top:16px">${S.units.map(u=>{const t=S.tenants.find(t=>t.unitId===u.id&&!t.moveOutDate),iv=!t;return`<div class="unit-card ${iv?'vacant':''}"><div class="unit-card-header"><div><h3 style="font-size:15px;font-weight:600">${u.name}</h3>${iv?'<span class="badge badge-yellow">Leer</span>':`<span class="badge badge-green">${t.name}</span>`}</div><div style="display:flex;gap:4px"><button class="btn btn-sm btn-secondary" data-eu="${u.id}"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger" data-du="${u.id}"><i class="fas fa-trash"></i></button></div></div><div class="unit-card-info"><p><i class="fas fa-ruler-combined"></i> ${u.size} m²</p><p><i class="fas fa-door-open"></i> ${u.rooms} Zimmer</p></div></div>`}).join('')}</div></div>`}

function rTenants(){return`<div class="card"><div class="card-header"><h2 class="card-title">Mieter (${S.tenants.length})</h2><button class="btn btn-success" id="atb"><i class="fas fa-plus"></i> Neu</button></div>${S.tenants.length>0?`<div style="overflow-x:auto;margin-top:16px"><table><thead><tr><th>Name</th><th>Einheit</th><th>Einzug</th><th>Status</th><th class="text-right">Aktionen</th></tr></thead><tbody>${S.tenants.map(t=>`<tr><td style="font-weight:500">${t.name}</td><td>${S.units.find(u=>u.id===t.unitId)?.name||'—'}</td><td>${fd(t.moveInDate)}</td><td>${t.moveOutDate?'<span class="badge badge-red">Ausgezogen</span>':'<span class="badge badge-green">Aktiv</span>'}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-et="${t.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-dt="${t.id}"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`}

function rPrepay(){return`<div class="card"><div class="card-header"><h2 class="card-title">Vorauszahlungen</h2><button class="btn btn-success" id="apb"><i class="fas fa-plus"></i> Neu</button></div>${S.prepayments.length>0?`<table style="margin-top:16px"><thead><tr><th>Mieter</th><th>Monatlich</th><th>Zeitraum</th><th class="text-right">Aktionen</th></tr></thead><tbody>${S.prepayments.map(p=>`<tr><td style="font-weight:500">${S.tenants.find(t=>t.id===p.tenantId)?.name||'—'}</td><td><span class="badge badge-green">${fc(p.monthlyAmount)}</span></td><td style="font-size:12px">${fd(p.startDate)}${p.endDate?' – '+fd(p.endDate):''}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-ep="${p.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-dp="${p.id}"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table>`:''}</div>`}

function rConsumptions(){const cy=new Date().getFullYear();return`<div class="card"><div class="card-header"><h2 class="card-title">Verbrauchsablesung</h2><button class="btn btn-primary" id="acb"><i class="fas fa-plus"></i> Neue Ablesung</button></div><div class="alert alert-legal"><i class="fas fa-balance-scale"></i><div><strong>HeizkostenV:</strong> 50-70% nach Verbrauch, 30-50% nach Fläche. Zählerstände für Heizung und Warmwasser erfassen.</div></div><table style="margin-top:16px"><thead><tr><th>Jahr</th><th>Einheit</th><th>Zähler-Nr.</th><th>Verbrauch</th><th class="text-right">Aktionen</th></tr></thead><tbody>${(S.consumptions||[]).map(c=>`<tr><td>${c.year}</td><td>${S.units.find(u=>u.id===c.unitId)?.name||'—'}</td><td>${c.meterNumber||'—'}</td><td>${c.value} ${c.unit||'kWh'}</td><td class="text-right"><button class="btn btn-sm btn-danger" data-dc="${c.id}"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`}

function rCosts(){return`<div class="card"><div class="card-header"><h2 class="card-title">Betriebskosten</h2><button class="btn btn-warning" id="acb2"><i class="fas fa-plus"></i> Neu</button></div>${S.costs.length>0?`<table style="margin-top:16px"><thead><tr><th>Datum</th><th>Kategorie</th><th>Beschreibung</th><th class="text-right">Betrag</th><th class="text-right">Aktionen</th></tr></thead><tbody>${S.costs.map(c=>`<tr><td>${fd(c.date)}</td><td><span class="badge badge-blue">${CC[c.category]?.l||c.category}</span></td><td>${c.description}</td><td class="text-right" style="font-weight:600">${fc(c.amount)}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-ec="${c.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-dc2="${c.id}"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table>`:''}</div>`}

function rYE(){const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear()))].sort(),ly=ys.length?ys[ys.length-1]:new Date().getFullYear(),ny=ly+1;return`<div class="card"><div class="card-header"><h2 class="card-title">Jahreswechsel</h2></div><div class="alert alert-info"><i class="fas fa-info-circle"></i><div>Stammdaten werden automatisch übernommen. Nur Kosten und Verbrauchsdaten müssen neu erfasst werden.</div></div><div class="form-grid" style="margin-top:16px"><div class="form-group"><label class="form-label">Quelle</label><select class="form-input" id="cfy">${ys.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Ziel</label><input class="form-input" type="number" id="cty" value="${ny}"></div></div><div class="form-actions"><button class="btn btn-primary" id="ccyb"><i class="fas fa-copy"></i> Kosten kopieren</button></div></div>`}

function rComparison(){const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear()))].sort();if(ys.length<2)return'<div class="card"><h3 class="card-title">Jahresvergleich</h3><p style="color:#6b7280;margin-top:16px">Mindestens 2 Jahre mit Kosten erforderlich für Vergleich.</p></div>';const data=ys.map(y=>({year:y,total:S.costs.filter(c=>new Date(c.date).getFullYear()===y).reduce((s,c)=>s+c.amount,0)}));const max=Math.max(...data.map(d=>d.total));return`<div class="card"><div class="card-header"><h2 class="card-title">Jahresvergleich</h2></div><div class="alert alert-info"><i class="fas fa-info-circle"></i><div><strong>Wirtschaftlichkeitsgebot:</strong> Steigerungen über 10-15% pro Jahr sollten begründet werden können.</div></div><div class="chart-bar">${data.map(d=>`<div class="chart-bar-item"><div class="chart-bar-value">${fc(d.total)}</div><div class="chart-bar-fill" style="height:${(d.total/max)*100}%"></div><div class="chart-bar-label">${d.year}</div></div>`).join('')}</div><table style="margin-top:24px"><thead><tr><th>Jahr</th><th class="text-right">Gesamtkosten</th><th class="text-right">Veränderung</th></tr></thead><tbody>${data.map((d,i)=>{const prev=i>0?data[i-1].total:null;const change=prev?((d.total-prev)/prev*100):0;return`<tr><td>${d.year}</td><td class="text-right" style="font-weight:600">${fc(d.total)}</td><td class="text-right">${prev?`<span style="color:${change>0?'#dc2626':'#16a34a'}">${change>0?'+':''}${change.toFixed(1)}%</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`}

let sy=new Date().getFullYear().toString();
function rSettle(){const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear().toString()))];if(!ys.length)ys.push(new Date().getFullYear().toString());ys.sort().reverse();if(!ys.includes(sy))sy=ys[0];const r=cs(sy),tt={};r.ds.forEach(d=>{if(!tt[d.tenantId])tt[d.tenantId]={name:d.tenantName,unit:d.unitName,categories:{},total:0};tt[d.tenantId].categories[d.category]=(tt[d.tenantId].categories[d.category]||0)+d.amount;tt[d.tenantId].total+=d.amount});Object.keys(tt).forEach(id=>{tt[id].prepayments=cp(id,sy);tt[id].balance=tt[id].prepayments-tt[id].total});return`<div class="card no-print"><div class="card-header"><h2 class="card-title">Abrechnung ${sy}</h2><div style="display:flex;gap:10px"><select class="form-input" id="ys">${ys.map(y=>`<option value="${y}" ${y===sy?'selected':''}>${y}</option>`).join('')}</select></div></div></div><div class="summary-grid"><div class="summary-card blue"><div class="summary-label">Gesamtkosten</div><div class="summary-value">${fc(r.tc)}</div></div><div class="summary-card green"><div class="summary-label">Umlagefähig</div><div class="summary-value">${fc(r.oc)}</div></div></div>${Object.keys(tt).length>0?`<div class="card"><h3 class="card-title">Mieter-Übersicht</h3><table class="settlement-table" style="margin-top:12px"><thead><tr><th>Mieter</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Saldo</th></tr></thead><tbody>${Object.entries(tt).map(([id,d])=>`<tr><td style="font-weight:500">${d.name}</td><td class="text-right">${fc(d.total)}</td><td class="text-right" style="color:#16a34a">${fc(d.prepayments)}</td><td class="text-right ${d.balance>0?'amount-negative':'amount-positive'}">${fc(Math.abs(d.balance))} ${d.balance>0?'Guthaben':'Nachzahlung'}</td></tr>`).join('')}</tbody></table></div>`:''}`}

function rLetters(){return`<div class="card"><div class="card-header"><h2 class="card-title">Mieteranschreiben</h2></div><div class="alert alert-info"><i class="fas fa-info-circle"></i><div>Begleitschreiben zur Abrechnung generieren mit Zahlungsaufforderung bei Nachzahlung.</div></div><p style="color:#6b7280;margin-top:16px">Funktion in Entwicklung...</p></div>`}

function rPdfView(){return'<div class="card"><p>PDF-Ansicht</p></div>'}

function ae(){document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pv=null;render()});const tb=document.getElementById('tsb');if(tb)tb.onclick=()=>{sc=!sc;render()};const mo=document.getElementById('mo');if(mo)mo.onclick=e=>{if(e.target===mo)mc=null,render()};const eb=document.getElementById('expBtn');if(eb)eb.onclick=exportBackup;const ib=document.getElementById('impBtn');if(ib)ib.onclick=()=>document.getElementById('ifi').click();const iz=document.getElementById('iz');if(iz){iz.onclick=()=>document.getElementById('ifi').click();iz.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)importBackup(f)}}const fi=document.getElementById('ifi');if(fi)fi.onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};const sp=document.getElementById('sp');if(sp)sp.onclick=()=>{if(!S.property)S.property={};const t=window._pt||'o';if(t==='o'){S.property.name=document.getElementById('pn').value.trim();S.property.address=document.getElementById('pa').value.trim()}else{S.property.owner=document.getElementById('po').value.trim();S.property.ownerAddress=document.getElementById('poad').value.trim();S.property.phone=document.getElementById('pp').value.trim();S.property.bank=document.getElementById('pb').value.trim()}sd(S);render();alert('Gespeichert!')}}
render();
</script>
</body>
</html>
