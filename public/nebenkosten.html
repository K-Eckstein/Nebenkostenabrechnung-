<body>
<div id="app"></div>
<script>
const SK='nk_v7',AV='2.0';
function ld(){try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r)}catch(e){}return{property:null,units:[],tenants:[],costs:[],customDistKeys:[],prepayments:[]}}
function sd(d){localStorage.setItem(SK,JSON.stringify(d))}
let S=ld(),tab='dashboard',sc=false,mc=null,pv=null;
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2)}
function fc(a){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(a)}
function fd(d){return d?new Date(d).toLocaleDateString('de-DE'):'—'}
const CC={heating:{l:'Heizung',b:true,h:true},hot_water:{l:'Warmwasser',b:true,h:true},water:{l:'Kaltwasser',b:true},sewage:{l:'Abwasser',b:true},garbage:{l:'Müllabfuhr',b:true},electricity_common:{l:'Allgemeinstrom',b:true},insurance:{l:'Versicherungen',b:true},maintenance:{l:'Instandhaltung',b:false},property_tax:{l:'Grundsteuer',b:true},cleaning:{l:'Reinigung',b:true},gardening:{l:'Gartenpflege',b:true},elevator:{l:'Aufzug',b:true},chimney:{l:'Schornsteinfeger',b:true},pest_control:{l:'Schädlingsbekämpfung',b:true},cable_tv:{l:'Kabel-TV',b:true},other:{l:'Sonstiges',b:true}};
const SDK={area:'Nach Wohnfläche (m²)',persons:'Nach Personenzahl',units:'Nach Wohneinheiten',consumption:'Nach Verbrauch'};
function adk(){const k={...SDK};(S.customDistKeys||[]).forEach(x=>{k[x.id]=x.name});return k}
function iuv(uid,cd){return S.tenants.filter(t=>{if(t.unitId!==uid)return false;const d=new Date(cd),mi=new Date(t.moveInDate),mo=t.moveOutDate?new Date(t.moveOutDate):null;if(mo&&d>mo)return false;if(d<mi)return false;return true}).length===0}
function cp(tid,y){const ps=S.prepayments.filter(p=>p.tenantId===tid);if(!ps.length)return 0;const ys=new Date(y+'-01-01'),ye=new Date(y+'-12-31');let t=0;for(const p of ps){const sd2=new Date(p.startDate),ed=p.endDate?new Date(p.endDate):ye,es=sd2>ys?sd2:ys,ee=ed<ye?ed:ye;if(es>ee)continue;t+=p.monthlyAmount*((ee.getFullYear()-es.getFullYear())*12+ee.getMonth()-es.getMonth()+1)}return t}
function cs(y){const fc2=S.costs.filter(c=>new Date(c.date).getFullYear().toString()===y),ul=fc2.filter(c=>CC[c.category]?.b!==false),nu=fc2.filter(c=>CC[c.category]?.b===false);let vc=0,oc=0;const ds=[];for(const cost of ul){const ou=S.units.filter(u=>!iuv(u.id,cost.date));if(!ou.length){vc+=cost.amount;continue}const oa=ou.reduce((s,u)=>s+u.size,0),ta=S.units.reduce((s,u)=>s+u.size,0),os=cost.distributionKey==='area'?oa/ta:1,uf=cost.amount*os;vc+=(cost.amount-uf);oc+=uf;const ts=S.tenants.filter(t=>{const u=S.units.find(x=>x.id===t.unitId);if(!u)return false;const d=new Date(cost.date),mi=new Date(t.moveInDate),mo=t.moveOutDate?new Date(t.moveOutDate):null;if(mo&&d>mo)return false;if(d<mi)return false;return true});let tw=0;for(const t of ts){const u=S.units.find(x=>x.id===t.unitId);if(!u)continue;tw+=cost.distributionKey==='area'?u.size:1}if(!tw)continue;for(const t of ts){const u=S.units.find(x=>x.id===t.unitId);if(!u)continue;const w=cost.distributionKey==='area'?u.size:1,sh=w/tw;ds.push({tenantId:t.id,tenantName:t.name,unitId:u.id,unitName:u.name,category:cost.category,amount:Math.round(uf*sh*100)/100,share:Math.round(sh*10000)/100})}}const vu=S.units.filter(u=>!S.tenants.some(t=>{if(t.unitId!==u.id)return false;const n=new Date(y+'-12-31'),ys=new Date(y+'-01-01'),mi=new Date(t.moveInDate),mo=t.moveOutDate?new Date(t.moveOutDate):null;if(mo&&ys>mo)return false;if(mi>n)return false;return true}));const bc={};ul.forEach(c=>{bc[c.category]=(bc[c.category]||0)+c.amount});return{tc:fc2.reduce((s,c)=>s+c.amount,0),ut:ul.reduce((s,c)=>s+c.amount,0),nu:nu.reduce((s,c)=>s+c.amount,0),vc,oc,ds,vu,bc}}
function gts(tid,y){const r=cs(y),td=r.ds.filter(d=>d.tenantId===tid),t=td.reduce((s,d)=>s+d.amount,0),c={};td.forEach(d=>{c[d.category]=(c[d.category]||0)+d.amount});const p=cp(tid,y);return{total:t,categories:c,prepayments:p,balance:p-t}}

// ============ BACKUP ============
function exportBackup(){const b={v:AV,d:new Date().toISOString(),app:'Nebenkostenabrechnung',data:S};const j=JSON.stringify(b,null,2),bl=new Blob([j],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');const dt=new Date().toISOString().split('T')[0],pn=(S.property?.name||'Nebenkosten').replace(/[^a-zA-Z0-9äöüÄÖÜß\-_]/g,'_');a.href=u;a.download=`Nebenkosten_Backup_${pn}_${dt}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);localStorage.setItem('lastBackup',new Date().toISOString());alert('✅ Backup erfolgreich erstellt!\n\nDatei: '+a.download+'\n\nBewahren Sie die Datei sicher auf.')}
function importBackup(file){const r=new FileReader();r.onload=e=>{try{const b=JSON.parse(e.target.result);if(!b.data)throw new Error('Keine Daten gefunden');if(!b.data.property&&!b.data.units&&!b.data.tenants)throw new Error('Fehlende Struktur');const m=`Backup importieren?\n\nVersion: ${b.v||'?'}\nExportiert: ${b.d?new Date(b.d).toLocaleString('de-DE'):'?'}\n\nObjekt: ${b.data.property?.name||'Keines'}\nEinheiten: ${b.data.units?.length||0}\nMieter: ${b.data.tenants?.length||0}\nKosten: ${b.data.costs?.length||0}\nVorauszahlungen: ${b.data.prepayments?.length||0}\n\n⚠️ Alle aktuellen Daten werden überschrieben!`;if(!confirm(m))return;S=b.data;sd(S);alert('✅ Import erfolgreich!');location.reload()}catch(err){alert('❌ Fehler: '+err.message)}};r.readAsText(file)}
function lbi(){const lb=localStorage.getItem('lastBackup');return lb?new Date(lb):null}

// ============ RENDER ============
function render(){document.getElementById('app').innerHTML=`<div class="app">${rSidebar()}<div class="main ${sc?'expanded':''}">${rTopbar()}<div class="content">${rContent()}</div></div></div>${mc?`<div class="modal-overlay" id="mo"><div class="modal">${mc}</div></div>`:''}`;ae()}
function rSidebar(){const items=[{s:'Übersicht',t:[{id:'dashboard',l:'Dashboard',i:'fas fa-chart-line'},{id:'backup',l:'Daten & Backup',i:'fas fa-shield-alt'}]},{s:'Stammdaten',t:[{id:'property',l:'Objekt & Vermieter',i:'fas fa-home'},{id:'units',l:'Wohneinheiten',i:'fas fa-building'},{id:'tenants',l:'Mieter',i:'fas fa-users'},{id:'prepayments',l:'Vorauszahlungen',i:'fas fa-money-bill-wave'}]},{s:'Bewirtschaftung',t:[{id:'costs',l:'Kosten',i:'fas fa-receipt'},{id:'distkeys',l:'Verteilerschlüssel',i:'fas fa-sliders-h'},{id:'yearend',l:'Jahreswechsel',i:'fas fa-calendar-plus'}]},{s:'Abrechnung',t:[{id:'settlement',l:'Abrechnung',i:'fas fa-file-invoice-dollar'},{id:'protokoll',l:'Vermieter-Protokoll',i:'fas fa-clipboard-list'}]}];return`<aside class="sidebar ${sc?'collapsed':''}"><div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-calculator"></i></div>${!sc?`<div><div class="sidebar-title">${S.property?.name||'Nebenkosten'}</div><div class="sidebar-subtitle">Abrechnung</div></div>`:''}</div><nav class="nav">${items.map(s=>`${!sc?`<div class="nav-section">${s.s}</div>`:''}${s.t.map(t=>`<button class="nav-btn ${tab===t.id?'active':''}" data-tab="${t.id}"><i class="${t.i}"></i>${!sc?`<span>${t.l}</span>`:''}</button>`).join('')}`).join('')}</nav><div class="sidebar-footer"><button class="sidebar-toggle" id="tsb"><i class="fas fa-chevron-${sc?'right':'left'}"></i>${!sc?'<span>Einklappen</span>':''}</button></div></aside>`}
function rTopbar(){const t={dashboard:'Dashboard',backup:'Daten & Backup',property:'Objekt & Vermieter',units:'Wohneinheiten',tenants:'Mieter',prepayments:'Vorauszahlungen',costs:'Betriebskosten',distkeys:'Verteilerschlüssel',yearend:'Jahreswechsel',settlement:'Nebenkostenabrechnung',protokoll:'Vermieter-Protokoll'};return`<header class="topbar"><h1>${t[tab]}</h1><div class="topbar-right"><i class="fas fa-database"></i><span>Lokale Speicherung</span></div></header>`}
function rContent(){if(pv)return rPdfView();switch(tab){case'dashboard':return rDash();case'backup':return rBackup();case'property':return rProp();case'units':return rUnits();case'tenants':return rTenants();case'prepayments':return rPrepay();case'costs':return rCosts();case'distkeys':return rDK();case'yearend':return rYE();case'settlement':return rSettle();case'protokoll':return rProto()}}

// ============ DASHBOARD ============
function rDash(){const tc=S.costs.reduce((s,c)=>s+c.amount,0),ta=S.units.reduce((s,u)=>s+u.size,0),occ=S.units.filter(u=>S.tenants.some(t=>t.unitId===u.id)),vac=S.units.filter(u=>!S.tenants.some(t=>t.unitId===u.id)),cy=new Date().getFullYear(),yt=S.costs.filter(c=>new Date(c.date).getFullYear()===cy).reduce((s,c)=>s+c.amount,0),nu=S.costs.filter(c=>CC[c.category]?.b===false).reduce((s,c)=>s+c.amount,0),tp=S.prepayments.reduce((s,p)=>s+p.monthlyAmount*12,0),lb=lbi(),dsb=lb?Math.floor((new Date()-lb)/864e5):null;return`${dsb===null||dsb>30?`<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>Backup-Erinnerung:</strong> ${dsb===null?'Noch nie ein Backup erstellt!':dsb+' Tage her.'} <a href="#" onclick="tab='backup';render();return false" style="color:#1e40af;text-decoration:underline;margin-left:8px">Jetzt erstellen</a></div></div>`:''}<div class="stats-grid"><div class="stat-card"><div class="stat-icon blue"><i class="fas fa-home"></i></div><div><div class="stat-value">${S.property?'✓':'—'}</div><div class="stat-label">Objekt</div></div></div><div class="stat-card"><div class="stat-icon green"><i class="fas fa-building"></i></div><div><div class="stat-value">${S.units.length}</div><div class="stat-label">Einheiten (${ta.toFixed(0)} m²)</div></div></div><div class="stat-card"><div class="stat-icon purple"><i class="fas fa-users"></i></div><div><div class="stat-value">${S.tenants.length}</div><div class="stat-label">Mieter</div></div></div><div class="stat-card"><div class="stat-icon orange"><i class="fas fa-receipt"></i></div><div><div class="stat-value">${fc(yt)}</div><div class="stat-label">Kosten ${cy}</div></div></div><div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div><div class="stat-value">${occ.length}</div><div class="stat-label">Vermietet</div></div></div><div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div><div><div class="stat-value">${vac.length}</div><div class="stat-label">Leerstände</div></div></div></div>${nu>0?`<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i><div><strong>Nicht umlegbar: ${fc(nu)}</strong><br><span style="font-size:12px">Instandhaltung § 555a BGB</span></div></div>`:''}${vac.length>0?`<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>${vac.length} Leerstand</strong> — ${vac.map(u=>u.name).join(', ')}</div></div>`:''}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px"><div class="card"><h3 class="card-title">Kosten nach Kategorie</h3><div style="margin-top:12px">${(()=>{const bc={};S.costs.forEach(c=>{bc[c.category]=(bc[c.category]||0)+c.amount});const s=Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,6);if(!s.length)return'<div class="empty-state"><i class="fas fa-chart-bar"></i><p>Keine Kosten</p></div>';return s.map(([cat,amt])=>{const p=tc>0?(amt/tc*100):0,n=CC[cat]?.b===false;return`<div style="margin-bottom:10px"><div class="progress-label"><span>${CC[cat]?.l||cat} ${n?'<span class="badge badge-red">Nicht umlegbar</span>':''}</span><span>${fc(amt)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${p}%;${n?'background:linear-gradient(90deg,#ef4444,#dc2626)':''}"></div></div></div>`}).join('')})()}</div></div><div class="card"><h3 class="card-title">Vorauszahlungen ${cy}</h3><div style="margin-top:12px"><div style="display:flex;justify-content:space-between;padding:12px;background:#f0fdf4;border-radius:8px;margin-bottom:8px"><span style="color:#166534">Monatlich</span><span style="font-weight:700;color:#166534">${fc(tp/12)}</span></div><div style="display:flex;justify-content:space-between;padding:12px;background:#eff6ff;border-radius:8px"><span style="color:#1e40af">Jährlich</span><span style="font-weight:700;color:#1e40af">${fc(tp)}</span></div></div></div></div>`}

// ============ BACKUP ============
function rBackup(){const lb=lbi(),ds=new Blob([JSON.stringify(S)]).size,dk=(ds/1024).toFixed(2);return`<div class="card backup-card"><div style="text-align:center;padding:20px 0"><div class="backup-icon"><i class="fas fa-shield-alt"></i></div><h2 style="font-size:24px;font-weight:700;margin-bottom:8px">Daten-Backup</h2><p style="color:#166534;margin-bottom:24px">Schützen Sie Ihre Daten vor Verlust</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px"><div style="padding:16px;background:#fff;border-radius:12px;border:1px solid #86efac"><div style="font-size:12px;color:#6b7280">Letztes Backup</div><div style="font-size:16px;font-weight:700;color:#166534;margin-top:4px">${lb?lb.toLocaleString('de-DE'):'Noch nie'}</div></div><div style="padding:16px;background:#fff;border-radius:12px;border:1px solid #86efac"><div style="font-size:12px;color:#6b7280">Datengröße</div><div style="font-size:16px;font-weight:700;color:#166534;margin-top:4px">${dk} KB</div></div><div style="padding:16px;background:#fff;border-radius:12px;border:1px solid #86efac"><div style="font-size:12px;color:#6b7280">Version</div><div style="font-size:16px;font-weight:700;color:#166534;margin-top:4px">${AV}</div></div></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn btn-success btn-lg" id="expBtn"><i class="fas fa-download"></i> Backup erstellen</button><button class="btn btn-primary btn-lg" id="impBtn"><i class="fas fa-upload"></i> Backup importieren</button></div></div></div><div class="card"><h3 class="card-title"><i class="fas fa-download" style="color:#16a34a;margin-right:8px"></i>Backup erstellen</h3><p style="color:#6b7280;margin-bottom:16px">Exportiert alle Daten als JSON-Datei. Bewahren Sie die Datei sicher auf.</p><div style="padding:16px;background:#f0fdf4;border-radius:8px;border-left:4px solid #16a34a"><p style="font-size:13px;color:#166534"><strong>Empfehlung:</strong> Regelmäßig Backups erstellen, besonders vor Jahreswechsel oder größeren Änderungen.</p></div></div><div class="card"><h3 class="card-title"><i class="fas fa-upload" style="color:#2563eb;margin-right:8px"></i>Backup importieren</h3><p style="color:#6b7280;margin-bottom:16px">Daten aus Backup-Datei wiederherstellen. <strong style="color:#dc2626">Achtung:</strong> Aktuelle Daten werden überschrieben!</p><div class="import-zone" id="iz"><i class="fas fa-cloud-upload-alt"></i><p style="font-size:16px;font-weight:600;color:#374151;margin-bottom:8px">Datei hier ablegen oder klicken</p><p style="font-size:13px;color:#6b7280">Format: .json</p><input type="file" id="ifi" accept=".json" style="display:none"></div></div><div class="card"><h3 class="card-title"><i class="fas fa-info-circle" style="color:#2563eb;margin-right:8px"></i>Was wird gesichert?</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:12px"><div><h4 style="font-size:14px;font-weight:600;margin-bottom:8px">Daten</h4><ul style="font-size:13px;color:#6b7280;line-height:1.8;margin-left:20px"><li>Objekt & Vermieter</li><li>Wohneinheiten</li><li>Mieter</li><li>Kosten</li><li>Vorauszahlungen</li><li>Verteilerschlüssel</li></ul></div><div><h4 style="font-size:14px;font-weight:600;margin-bottom:8px">Wann Backup?</h4><ul style="font-size:13px;color:#6b7280;line-height:1.8;margin-left:20px"><li>Vor Jahreswechsel</li><li>Nach großen Änderungen</li><li>Regelmäßig (monatlich)</li><li>Vor Browser-Reset</li></ul></div></div></div><div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>Wichtig:</strong> Daten werden nur lokal im Browser gespeichert. Bei Browser-Reset gehen sie ohne Backup verloren!</div></div>`}

// ============ PROPERTY ============
function rProp(){const p=S.property;return`<div class="card"><div class="card-header"><div><h2 class="card-title">Objekt & Vermieter</h2></div></div><div class="tab-bar no-print"><button class="tab-btn ${!window._pt||window._pt==='o'?'active':''}" onclick="window._pt='o';render()">Objektdaten</button><button class="tab-btn ${window._pt==='v'?'active':''}" onclick="window._pt='v';render()">Vermieter / Briefkopf</button></div>${(!window._pt||window._pt==='o')?`<div class="form-grid"><div class="form-group"><label class="form-label">Objektbezeichnung <span class="req">*</span></label><input class="form-input" id="pn" value="${p?.name||''}"></div><div class="form-group"><label class="form-label">Baujahr</label><input class="form-input" type="number" id="py" value="${p?.yearBuilt||''}"></div><div class="form-group full"><label class="form-label">Objektadresse <span class="req">*</span></label><input class="form-input" id="pa" value="${p?.address||''}" placeholder="Straße, PLZ, Ort"></div><div class="form-group"><label class="form-label">Grundstücksfläche (m²)</label><input class="form-input" type="number" id="pl" value="${p?.landArea||''}" step="0.01"></div><div class="form-group"><label class="form-label">Flurstück / Grundbuch</label><input class="form-input" id="pr" value="${p?.landRegistry||''}"></div><div class="form-group full"><label class="form-label">Bemerkungen</label><textarea class="form-textarea" id="pno">${p?.notes||''}</textarea></div></div>`:`<div class="form-grid"><div class="form-group"><label class="form-label">Name / Firma <span class="req">*</span></label><input class="form-input" id="po" value="${p?.owner||''}"></div><div class="form-group"><label class="form-label">Zusatz</label><input class="form-input" id="poa" value="${p?.ownerAdd||''}" placeholder="c/o Hausverwaltung"></div><div class="form-group full"><label class="form-label">Anschrift <span class="req">*</span></label><input class="form-input" id="poad" value="${p?.ownerAddress||''}"></div><div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="pp" value="${p?.phone||''}"></div><div class="form-group"><label class="form-label">E-Mail</label><input class="form-input" type="email" id="pe" value="${p?.email||''}"></div><div class="form-group"><label class="form-label">Steuernummer</label><input class="form-input" id="pti" value="${p?.taxId||''}"></div><div class="form-group"><label class="form-label">IBAN</label><input class="form-input" id="pb" value="${p?.bank||''}"></div><div class="form-group"><label class="form-label">Bank</label><input class="form-input" id="pbn" value="${p?.bankName||''}"></div></div>`}<div class="form-actions"><button class="btn btn-primary" id="sp"><i class="fas fa-save"></i> Speichern</button></div></div>`}

// ============ UNITS ============
function rUnits(){const ta=S.units.reduce((s,u)=>s+u.size,0),v=S.units.filter(u=>!S.tenants.some(t=>t.unitId===u.id));return`<div class="card"><div class="card-header"><div><h2 class="card-title">Wohneinheiten</h2><p class="card-subtitle">${S.units.length} Einheiten · ${ta.toFixed(0)} m² · ${v.length} leer</p></div><button class="btn btn-primary" id="aub"><i class="fas fa-plus"></i> Neu</button></div><div class="unit-grid" style="margin-top:16px">${S.units.map(u=>{const t=S.tenants.find(t=>t.unitId===u.id&&!t.moveOutDate),iv=!t;return`<div class="unit-card ${iv?'vacant':''}"><div class="unit-card-header"><div><h3 style="font-size:15px;font-weight:600">${u.name}</h3>${iv?'<span class="badge badge-yellow">Leer</span>':`<span class="badge badge-green">${t.name}</span>`}</div><div style="display:flex;gap:4px"><button class="btn btn-sm btn-secondary" data-eu="${u.id}"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger" data-du="${u.id}"><i class="fas fa-trash"></i></button></div></div><div class="unit-card-info"><p><i class="fas fa-ruler-combined"></i> ${u.size} m²</p><p><i class="fas fa-door-open"></i> ${u.rooms} Zimmer</p><p><i class="fas fa-layer-group"></i> ${u.floor}. Etage</p>${u.type?`<p><i class="fas fa-tag"></i> ${u.type}</p>`:''}</div></div>`}).join('')}</div>${S.units.length===0?'<div class="empty-state"><i class="fas fa-building"></i><p>Keine Einheiten</p></div>':''}</div>`}

// ============ TENANTS ============
function rTenants(){return`<div class="card"><div class="card-header"><div><h2 class="card-title">Mieter</h2><p class="card-subtitle">${S.tenants.length} Mieter</p></div><button class="btn btn-success" id="atb" ${S.units.length===0?'disabled style="opacity:.5"':''}><i class="fas fa-plus"></i> Neu</button></div>${S.tenants.length>0?`<div style="overflow-x:auto;margin-top:16px"><table><thead><tr><th>Name</th><th>Einheit</th><th>Einzug</th><th>Status</th><th>Vorauszahlung</th><th class="text-right">Aktionen</th></tr></thead><tbody>${S.tenants.map(t=>{const u=S.units.find(x=>x.id===t.unitId),p=S.prepayments.find(p=>p.tenantId===t.id);return`<tr><td style="font-weight:500">${t.name}</td><td>${u?.name||'—'}</td><td>${fd(t.moveInDate)}</td><td>${t.moveOutDate?`<span class="badge badge-red">${fd(t.moveOutDate)}</span>`:'<span class="badge badge-green">Aktiv</span>'}</td><td>${p?`<span class="badge badge-blue">${fc(p.monthlyAmount)}/Mo</span>`:'<span class="badge badge-gray">—</span>'}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-et="${t.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-dt="${t.id}"><i class="fas fa-trash"></i></button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty-state"><i class="fas fa-users"></i><p>Keine Mieter</p></div>'}</div>`}

// ============ PREPAYMENTS ============
function rPrepay(){const tm=S.prepayments.reduce((s,p)=>s+p.monthlyAmount,0);return`<div class="card"><div class="card-header"><div><h2 class="card-title">Vorauszahlungen</h2><p class="card-subtitle">${S.prepayments.length} · ${fc(tm)}/Monat</p></div><button class="btn btn-success" id="apb" ${S.tenants.length===0?'disabled style="opacity:.5"':''}><i class="fas fa-plus"></i> Neu</button></div>${S.prepayments.length>0?`<div style="overflow-x:auto;margin-top:16px"><table><thead><tr><th>Mieter</th><th>Monatlich</th><th>Jährlich</th><th>Zeitraum</th><th class="text-right">Aktionen</th></tr></thead><tbody>${S.prepayments.map(p=>{const t=S.tenants.find(x=>x.id===p.tenantId);return`<tr><td style="font-weight:500">${t?.name||'—'}</td><td><span class="badge badge-green">${fc(p.monthlyAmount)}</span></td><td style="font-weight:600">${fc(p.monthlyAmount*12)}</td><td style="font-size:12px">${fd(p.startDate)}${p.endDate?' – '+fd(p.endDate):' (laufend)'}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-ep="${p.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-dp="${p.id}"><i class="fas fa-trash"></i></button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty-state"><i class="fas fa-money-bill-wave"></i><p>Keine Vorauszahlungen</p></div>'}</div>`}

// ============ COSTS ============
let cf='all';
function rCosts(){const f=cf==='all'?S.costs:S.costs.filter(c=>c.category===cf),t=f.reduce((s,c)=>s+c.amount,0),so=[...f].sort((a,b)=>new Date(b.date)-new Date(a.date)),ak=adk();return`<div class="card"><div class="card-header"><div><h2 class="card-title">Betriebskosten</h2><p class="card-subtitle">${S.costs.length} Einträge · ${fc(t)}</p></div><div style="display:flex;gap:8px"><button class="btn btn-secondary" id="ccb"><i class="fas fa-copy"></i> Vorjahr kopieren</button><button class="btn btn-warning" id="acb"><i class="fas fa-plus"></i> Neu</button></div></div><div class="filter-bar"><button class="filter-btn ${cf==='all'?'active':''}" data-flt="all">Alle</button>${Object.entries(CC).map(([k,v])=>`<button class="filter-btn ${cf===k?'active':''}" data-flt="${k}">${v.l}${v.b===false?' ⚠':''}</button>`).join('')}</div>${so.length>0?`<div style="overflow-x:auto"><table><thead><tr><th>Datum</th><th>Kategorie</th><th>Beschreibung</th><th>Verteiler</th><th class="text-right">Betrag</th><th class="text-right">Aktionen</th></tr></thead><tbody>${so.map(c=>{const cat=CC[c.category],n=cat?.b===false;return`<tr ${n?'style="background:#fef2f2"':''}><td>${fd(c.date)}</td><td><span class="badge ${n?'badge-red':'badge-blue'}">${cat?.l||c.category}</span></td><td>${c.description}</td><td style="font-size:12px">${ak[c.distributionKey]||c.distributionKey}</td><td class="text-right" style="font-weight:600">${fc(c.amount)}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-ec="${c.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-dc="${c.id}"><i class="fas fa-trash"></i></button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty-state"><i class="fas fa-receipt"></i><p>Keine Kosten</p></div>'}</div>`}

// ============ DIST KEYS ============
function rDK(){const c=S.customDistKeys||[];return`<div class="card"><div class="card-header"><div><h2 class="card-title">Verteilerschlüssel</h2></div><button class="btn btn-primary" id="adkb"><i class="fas fa-plus"></i> Neu</button></div><h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Standard</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:24px">${Object.entries(SDK).map(([k,v])=>`<div style="padding:12px;background:#f0f9ff;border-radius:8px;border:1px solid #bfdbfe"><div style="font-weight:600;font-size:13px;color:#1e40af">${v}</div></div>`).join('')}</div><h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Eigene</h3>${c.length>0?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px">${c.map(k=>`<div style="padding:12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:600;font-size:13px;color:#166534">${k.name}</div><div style="font-size:11px;color:#6b7280">${k.description||''}</div></div><button class="btn btn-sm btn-danger" data-ddk="${k.id}"><i class="fas fa-trash"></i></button></div>`).join('')}</div>`:'<p style="color:#9ca3af;font-size:13px">Keine eigenen Schlüssel.</p>'}</div>`}

// ============ YEAR END ============
function rYE(){const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear()))].sort(),ly=ys.length?ys[ys.length-1]:new Date().getFullYear(),ny=ly+1;return`<div class="card"><div class="card-header"><div><h2 class="card-title">Jahreswechsel</h2><p class="card-subtitle">Daten übernehmen, nur Änderungen eingeben</p></div></div><div class="alert alert-info"><i class="fas fa-info-circle"></i><div><strong>Automatisch übernommen:</strong> Objekt, Einheiten, Mieter, Schlüssel, Vorauszahlungen. Nur Kosten müssen neu erfasst oder kopiert werden.</div></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon blue"><i class="fas fa-calendar"></i></div><div><div class="stat-value">${ly}</div><div class="stat-label">Aktuelles Jahr</div></div></div><div class="stat-card"><div class="stat-icon green"><i class="fas fa-receipt"></i></div><div><div class="stat-value">${S.costs.filter(c=>new Date(c.date).getFullYear()===ly).length}</div><div class="stat-label">Kosten ${ly}</div></div></div><div class="stat-card"><div class="stat-icon purple"><i class="fas fa-arrow-right"></i></div><div><div class="stat-value">${ny}</div><div class="stat-label">Nächstes Jahr</div></div></div></div><div class="form-grid" style="margin-bottom:16px"><div class="form-group"><label class="form-label">Quelle</label><select class="form-input" id="cfy">${ys.map(y=>`<option value="${y}" ${y===ly?'selected':''}>${y}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Ziel</label><input class="form-input" type="number" id="cty" value="${ny}"></div><div class="form-group"><label class="form-label">Neues Datum</label><input class="form-input" type="date" id="cnd" value="${ny}-01-01"></div></div><div class="form-actions"><button class="btn btn-primary" id="ccyb"><i class="fas fa-copy"></i> Kosten kopieren</button></div></div>`}

// ============ SETTLEMENT ============
let sy=new Date().getFullYear().toString();
function rSettle(){const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear().toString()))];if(!ys.length)ys.push(new Date().getFullYear().toString());ys.sort().reverse();if(!ys.includes(sy))sy=ys[0];const r=cs(sy),tt={};r.ds.forEach(d=>{if(!tt[d.tenantId])tt[d.tenantId]={name:d.tenantName,unit:d.unitName,categories:{},total:0};tt[d.tenantId].categories[d.category]=(tt[d.tenantId].categories[d.category]||0)+d.amount;tt[d.tenantId].total+=d.amount});Object.keys(tt).forEach(id=>{tt[id].prepayments=cp(id,sy);tt[id].balance=tt[id].prepayments-tt[id].total});const uc=Object.keys(r.bc),tp=Object.values(tt).reduce((s,t)=>s+t.prepayments,0),tb=Object.values(tt).reduce((s,t)=>s+t.balance,0);return`<div class="card no-print"><div class="card-header"><div><h2 class="card-title">Abrechnung ${sy}</h2><p class="card-subtitle">01.01.${sy} – 31.12.${sy}</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><select class="form-input" id="ys">${ys.map(y=>`<option value="${y}" ${y===sy?'selected':''}>${y}</option>`).join('')}</select><button class="btn btn-purple" id="pab"><i class="fas fa-print"></i> Alle PDFs</button><button class="btn btn-teal" id="archbtn"><i class="fas fa-archive"></i> Archiv-PDF (Finanzamt)</button></div></div></div><div class="summary-grid"><div class="summary-card blue"><div class="summary-label">Gesamtkosten</div><div class="summary-value">${fc(r.tc)}</div></div><div class="summary-card green"><div class="summary-label">Umlagefähig</div><div class="summary-value">${fc(r.oc)}</div></div><div class="summary-card amber"><div class="summary-label">Vorauszahlungen</div><div class="summary-value">${fc(tp)}</div></div><div class="summary-card ${tb>=0?'emerald':'red'}"><div class="summary-label">Saldo</div><div class="summary-value">${fc(Math.abs(tb))}</div><div class="summary-sub">${tb>=0?'Guthaben':'Nachzahlung'}</div></div></div>${r.vu.length>0?`<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>Leerstand: ${fc(r.vc)}</strong> — ${r.vu.map(u=>u.name).join(', ')}</div></div>`:''}${r.nu>0?`<div class="alert alert-danger"><i class="fas fa-times-circle"></i><div><strong>Nicht umlegbar: ${fc(r.nu)}</strong></div></div>`:''}${Object.keys(tt).length>0?`<div class="card"><h3 class="card-title">Einzelabrechnung</h3><div style="overflow-x:auto;margin-top:12px"><table class="settlement-table"><thead><tr><th>Mieter</th><th>Einheit</th>${uc.map(c=>`<th class="text-right">${CC[c]?.l||c}</th>`).join('')}<th class="text-right">Kosten</th><th class="text-right">Voraus-zahlung</th><th class="text-right">Saldo</th><th class="text-right no-print">PDF</th></tr></thead><tbody>${Object.entries(tt).map(([id,d])=>{const bc=d.balance>0?'amount-negative':d.balance<0?'amount-positive':'amount-zero',bl=d.balance>0?'Guthaben':d.balance<0?'Nachzahlung':'Ausgeglichen';return`<tr><td style="font-weight:500">${d.name}</td><td>${d.unit}</td>${uc.map(c=>`<td class="text-right">${d.categories[c]?fc(d.categories[c]):'—'}</td>`).join('')}<td class="text-right" style="font-weight:600">${fc(d.total)}</td><td class="text-right" style="color:#16a34a">${fc(d.prepayments)}</td><td class="text-right ${bc}">${fc(Math.abs(d.balance))}<br><span style="font-size:10px">${bl}</span></td><td class="text-right no-print"><button class="btn btn-sm btn-purple" data-pdt="${id}"><i class="fas fa-file-pdf"></i></button></td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="2">Summe</td>${uc.map(c=>`<td class="text-right">${fc(r.bc[c]||0)}</td>`).join('')}<td class="text-right" style="color:#2563eb">${fc(r.oc)}</td><td class="text-right" style="color:#16a34a">${fc(tp)}</td><td class="text-right" style="color:${tb>=0?'#16a34a':'#dc2626'}">${fc(Math.abs(tb))}</td><td class="no-print"></td></tr></tfoot></table></div></div>`:''}`}

// ============ PROTOKOLL ============
function rProto(){const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear().toString()))];if(!ys.length)ys.push(new Date().getFullYear().toString());ys.sort().reverse();if(!ys.includes(sy))sy=ys[0];const r=cs(sy),td={};r.ds.forEach(d=>{if(!td[d.tenantId])td[d.tenantId]={name:d.tenantName,unit:d.unitName,total:0};td[d.tenantId].total+=d.amount});Object.keys(td).forEach(id=>{td[id].prepayments=cp(id,sy);td[id].balance=td[id].prepayments-td[id].total});const nz=Object.values(td).filter(t=>t.balance<0),gu=Object.values(td).filter(t=>t.balance>0),tn=nz.reduce((s,t)=>s+Math.abs(t.balance),0),tg=gu.reduce((s,t)=>s+t.balance,0);return`<div class="card no-print"><div class="card-header"><div><h2 class="card-title">Vermieter-Protokoll ${sy}</h2></div><div style="display:flex;gap:10px"><select class="form-input" id="pys">${ys.map(y=>`<option value="${y}" ${y===sy?'selected':''}>${y}</option>`).join('')}</select><button class="btn btn-purple" id="ppb"><i class="fas fa-print"></i> Drucken</button></div></div></div><div class="summary-grid"><div class="summary-card red"><div class="summary-label">Nachzahlungen</div><div class="summary-value">${fc(tn)}</div><div class="summary-sub">${nz.length} Mieter</div></div><div class="summary-card emerald"><div class="summary-label">Guthaben</div><div class="summary-value">${fc(tg)}</div><div class="summary-sub">${gu.length} Mieter</div></div></div>${nz.length>0?`<div class="card"><h3 class="card-title" style="color:#dc2626"><i class="fas fa-arrow-down" style="margin-right:8px"></i>Nachzahlungspflichtig</h3><div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Mieter</th><th>Einheit</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Nachzahlung</th></tr></thead><tbody>${nz.sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance)).map(t=>`<tr><td style="font-weight:500">${t.name}</td><td>${t.unit}</td><td class="text-right">${fc(t.total)}</td><td class="text-right" style="color:#16a34a">${fc(t.prepayments)}</td><td class="text-right amount-positive">${fc(Math.abs(t.balance))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4" style="font-weight:700">Summe</td><td class="text-right" style="font-weight:700;color:#dc2626">${fc(tn)}</td></tr></tfoot></table></div></div>`:''}${gu.length>0?`<div class="card"><h3 class="card-title" style="color:#16a34a"><i class="fas fa-arrow-up" style="margin-right:8px"></i>Guthaben</h3><div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Mieter</th><th>Einheit</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Guthaben</th></tr></thead><tbody>${gu.sort((a,b)=>b.balance-a.balance).map(t=>`<tr><td style="font-weight:500">${t.name}</td><td>${t.unit}</td><td class="text-right">${fc(t.total)}</td><td class="text-right" style="color:#16a34a">${fc(t.prepayments)}</td><td class="text-right amount-negative">${fc(t.balance)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4" style="font-weight:700">Summe</td><td class="text-right" style="font-weight:700;color:#16a34a">${fc(tg)}</td></tr></tfoot></table></div></div>`:''}`}

// ============ PDF ============
function rPdfView(){if(pv.type==='tenant')return rTPdf(pv.tid,pv.year);if(pv.type==='protokoll')return rPPdf(pv.year);if(pv.type==='all')return rAPPdf(pv.year);if(pv.type==='archive')return rArchivePdf(pv.year);return''}
function glh(){const p=S.property;if(!p)return{sh:'',fh:''};const fl=[p.phone?'Tel: '+p.phone:'',p.email||'',p.bankName||'',p.bank?'IBAN: '+p.bank:'',p.taxId?'St.-Nr: '+p.taxId:''].filter(Boolean);return{sh:`<div class="pdf-letterhead-sender"><strong>${p.owner||'Vermieter'}</strong>${p.ownerAdd?'<br>'+p.ownerAdd:''}<br>${p.ownerAddress||''}</div>`,fh:fl.join(' | ')}}
function rTPdf(tid,year){const t=S.tenants.find(x=>x.id===tid);if(!t)return'';const u=S.units.find(x=>x.id===t.unitId),se=gts(tid,year),r=cs(year),lh=glh(),uc=Object.keys(r.bc),bc=se.balance>0?'guthaben':se.balance<0?'nachzahlung':'ausgeglichen',bl=se.balance>0?'Guthaben':se.balance<0?'Nachzahlung':'Ausgeglichen',p=S.property;return`<div class="no-print" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h3 style="font-size:18px;font-weight:700">PDF: ${t.name}</h3><div style="display:flex;gap:10px"><button class="btn btn-purple" onclick="window.print()"><i class="fas fa-print"></i> Drucken</button><button class="btn btn-secondary" onclick="pv=null;render()"><i class="fas fa-times"></i> Schließen</button></div></div><div class="pdf-page"><div class="pdf-letterhead">${lh.sh}<div class="pdf-letterhead-logo"><h1>${p?.name||'Objekt'}</h1><p>${p?.address||''}</p></div></div><div class="pdf-recipient"><p><strong>${t.name}</strong><br>${u?.name||''}<br>${p?.address||''}</p></div><div class="pdf-date">${p?.ownerAddress||p?.address||''}, den ${new Date().toLocaleDateString('de-DE')}</div><div class="pdf-subject">Nebenkostenabrechnung 01.01.${year} – 31.12.${year}</div><div class="pdf-section"><h2>Betriebskosten</h2><table class="pdf-table"><thead><tr><th>Pos.</th><th>Kostenart</th><th class="text-right">Gesamt</th><th class="text-right">Verteiler</th><th class="text-right">Ihr Anteil</th></tr></thead><tbody>${uc.filter(c=>se.categories[c]).map((cat,i)=>{const cost=S.costs.find(c=>c.category===cat&&new Date(c.date).getFullYear().toString()===year),dk=cost?adk()[cost.distributionKey]:'—';return`<tr><td>${i+1}</td><td>${CC[cat]?.l||cat}</td><td class="text-right">${fc(r.bc[cat])}</td><td class="text-right" style="font-size:9pt">${dk}</td><td class="text-right"><strong>${fc(se.categories[cat])}</strong></td></tr>`}).join('')}<tr class="pdf-total-row"><td></td><td><strong>Gesamt</strong></td><td class="text-right">${fc(r.oc)}</td><td></td><td class="text-right"><strong>${fc(se.total)}</strong></td></tr></tbody></table></div><div class="pdf-section"><h2>Verrechnung</h2><table class="pdf-table"><tbody><tr><td>Betriebskosten</td><td class="text-right"><strong>${fc(se.total)}</strong></td></tr><tr><td>Vorauszahlungen (${fc(se.prepayments/12)}/Monat)</td><td class="text-right" style="color:#16a34a"><strong>– ${fc(se.prepayments)}</strong></td></tr><tr class="pdf-total-row"><td><strong>${bl}</strong></td><td class="text-right"><strong>${fc(Math.abs(se.balance))}</strong></td></tr></tbody></table></div><div class="pdf-balance ${bc}"><div class="pdf-balance-label">${bl}</div><div class="pdf-balance-amount">${fc(Math.abs(se.balance))}</div></div><div class="pdf-signature"><p>Mit freundlichen Grüßen</p><div class="pdf-signature-line">${p?.owner||'Vermieter'}</div></div><div class="pdf-footer"><p>Abrechnung nach BetrKV § 2 und § 556a BGB. Abrechnungsfrist: 12 Monate.</p><div class="pdf-footer-sender">${lh.fh}</div></div></div>`}
function rPPdf(year){const r=cs(year),td={};r.ds.forEach(d=>{if(!td[d.tenantId])td[d.tenantId]={name:d.tenantName,unit:d.unitName,total:0};td[d.tenantId].total+=d.amount});Object.keys(td).forEach(id=>{td[id].prepayments=cp(id,year);td[id].balance=td[id].prepayments-td[id].total});const nz=Object.values(td).filter(t=>t.balance<0),gu=Object.values(td).filter(t=>t.balance>0),tn=nz.reduce((s,t)=>s+Math.abs(t.balance),0),tg=gu.reduce((s,t)=>s+t.balance,0),p=S.property,lh=glh();return`<div class="no-print" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h3 style="font-size:18px;font-weight:700">Protokoll ${year}</h3><div style="display:flex;gap:10px"><button class="btn btn-purple" onclick="window.print()"><i class="fas fa-print"></i> Drucken</button><button class="btn btn-secondary" onclick="pv=null;render()"><i class="fas fa-times"></i> Schließen</button></div></div><div class="pdf-page"><div class="pdf-letterhead">${lh.sh}<div class="pdf-letterhead-logo"><h1>VERMIETER-PROTOKOLL</h1><p>Intern · Vertraulich</p></div></div><div class="protokoll-header"><h1>Protokoll ${year}</h1><p>${p?.name||''} · ${p?.address||''}</p></div><div class="protokoll-summary"><div class="protokoll-box nachzahlung"><div class="protokoll-box-label">Nachzahlungen</div><div class="protokoll-box-value">${fc(tn)}</div><div style="font-size:9pt;color:#6b7280;margin-top:4px">${nz.length} Mieter</div></div><div class="protokoll-box guthaben"><div class="protokoll-box-label">Rückzahlungen</div><div class="protokoll-box-value">${fc(tg)}</div><div style="font-size:9pt;color:#6b7280;margin-top:4px">${gu.length} Mieter</div></div><div class="protokoll-box gesamt"><div class="protokoll-box-label">Umlagefähig</div><div class="protokoll-box-value">${fc(r.oc)}</div></div></div>${nz.length>0?`<div class="pdf-section"><h2>Nachzahlungspflichtig</h2><table class="pdf-table"><thead><tr><th>Mieter</th><th>Einheit</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Nachzahlung</th></tr></thead><tbody>${nz.sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance)).map(t=>`<tr><td><strong>${t.name}</strong></td><td>${t.unit}</td><td class="text-right">${fc(t.total)}</td><td class="text-right">${fc(t.prepayments)}</td><td class="text-right" style="color:#dc2626;font-weight:700">${fc(Math.abs(t.balance))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4"><strong>Summe</strong></td><td class="text-right" style="color:#dc2626;font-weight:700">${fc(tn)}</td></tr></tfoot></table></div>`:''}${gu.length>0?`<div class="pdf-section"><h2>Guthaben</h2><table class="pdf-table"><thead><tr><th>Mieter</th><th>Einheit</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Guthaben</th></tr></thead><tbody>${gu.sort((a,b)=>b.balance-a.balance).map(t=>`<tr><td><strong>${t.name}</strong></td><td>${t.unit}</td><td class="text-right">${fc(t.total)}</td><td class="text-right">${fc(t.prepayments)}</td><td class="text-right" style="color:#16a34a;font-weight:700">${fc(t.balance)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4"><strong>Summe</strong></td><td class="text-right" style="color:#16a34a;font-weight:700">${fc(tg)}</td></tr></tfoot></table></div>`:''}<div class="pdf-section"><h2>Vermieteranteil</h2><table class="pdf-table"><tbody><tr><td>Leerstandskosten</td><td class="text-right">${fc(r.vc)}</td></tr><tr><td>Nicht umlegbar</td><td class="text-right">${fc(r.nu)}</td></tr><tr class="pdf-total-row"><td><strong>Gesamt</strong></td><td class="text-right"><strong>${fc(r.vc+r.nu)}</strong></td></tr></tbody></table></div><div class="pdf-footer"><div class="pdf-footer-sender">${lh.fh}</div></div></div>`}
function rAPPdf(year){const r=cs(year),tids=[...new Set(r.ds.map(d=>d.tenantId))];let h=`<div class="no-print" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h3 style="font-size:18px;font-weight:700">Alle Abrechnungen ${year}</h3><div style="display:flex;gap:10px"><button class="btn btn-purple" onclick="window.print()"><i class="fas fa-print"></i> Alle drucken</button><button class="btn btn-secondary" onclick="pv=null;render()"><i class="fas fa-times"></i> Schließen</button></div></div>`;tids.forEach(tid=>{const t=S.tenants.find(x=>x.id===tid);if(!t)return;const u=S.units.find(x=>x.id===t.unitId),se=gts(tid,year),lh=glh(),uc=Object.keys(r.bc),bc=se.balance>0?'guthaben':se.balance<0?'nachzahlung':'ausgeglichen',bl=se.balance>0?'Guthaben':se.balance<0?'Nachzahlung':'Ausgeglichen',p=S.property;h+=`<div class="pdf-page"><div class="pdf-letterhead">${lh.sh}<div class="pdf-letterhead-logo"><h1>${p?.name||''}</h1><p>${p?.address||''}</p></div></div><div class="pdf-recipient"><p><strong>${t.name}</strong><br>${u?.name||''}<br>${p?.address||''}</p></div><div class="pdf-date">${p?.ownerAddress||p?.address||''}, den ${new Date().toLocaleDateString('de-DE')}</div><div class="pdf-subject">Nebenkostenabrechnung 01.01.${year} – 31.12.${year}</div><div class="pdf-section"><table class="pdf-table"><thead><tr><th>Kostenart</th><th class="text-right">Anteil</th></tr></thead><tbody>${uc.filter(c=>se.categories[c]).map(cat=>`<tr><td>${CC[cat]?.l||cat}</td><td class="text-right">${fc(se.categories[cat])}</td></tr>`).join('')}<tr class="pdf-total-row"><td><strong>Gesamt</strong></td><td class="text-right"><strong>${fc(se.total)}</strong></td></tr></tbody></table></div><div class="pdf-section"><table class="pdf-table"><tbody><tr><td>Kosten</td><td class="text-right">${fc(se.total)}</td></tr><tr><td>Vorauszahlungen</td><td class="text-right" style="color:#16a34a">– ${fc(se.prepayments)}</td></tr><tr class="pdf-total-row"><td><strong>${bl}</strong></td><td class="text-right"><strong>${fc(Math.abs(se.balance))}</strong></td></tr></tbody></table></div><div class="pdf-balance ${bc}"><div class="pdf-balance-label">${bl}</div><div class="pdf-balance-amount">${fc(Math.abs(se.balance))}</div></div><div class="pdf-signature"><p>Mit freundlichen Grüßen</p><div class="pdf-signature-line">${p?.owner||'Vermieter'}</div></div><div class="pdf-footer"><div class="pdf-footer-sender">${lh.fh}</div></div></div>`});return h}

function sCF(eid){const c=eid?S.costs.find(x=>x.id===eid):null,ak=adk();mc=`<h2 class="modal-title">${c?'Bearbeiten':'Neue Kosten'}</h2><div class="form-grid"><div class="form-group"><label class="form-label">Kategorie <span class="req">*</span></label><select class="form-input" id="f1">${Object.entries(CC).map(([k,v])=>`<option value="${k}" ${c?.category===k?'selected':''}>${v.l}${v.b===false?' ⚠':''}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Beschreibung <span class="req">*</span></label><input class="form-input" id="f2" value="${c?.description||''}"></div><div class="form-group"><label class="form-label">Betrag (€) <span class="req">*</span></label><input class="form-input" type="number" id="f3" value="${c?.amount||''}" step="0.01"></div><div class="form-group"><label class="form-label">Datum <span class="req">*</span></label><input class="form-input" type="date" id="f4" value="${c?.date||new Date().toISOString().split('T')[0]}"></div><div class="form-group"><label class="form-label">Verteiler <span class="req">*</span></label><select class="form-input" id="f5">${Object.entries(ak).map(([k,v])=>`<option value="${k}" ${c?.distributionKey===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Rechnungsnr.</label><input class="form-input" id="f6" value="${c?.invoiceNo||''}"></div></div><div class="form-actions"><button class="btn btn-warning" id="sv">${c?'Speichern':'Anlegen'}</button><button class="btn btn-secondary" onclick="cm()">Abbrechen</button></div>`;render();document.getElementById('sv').onclick=()=>{const d=document.getElementById('f2').value.trim(),a=parseFloat(document.getElementById('f3').value),dt=document.getElementById('f4').value;if(!d||!a||!dt)return alert('Pflichtfelder!');const data={category:document.getElementById('f1').value,description:d,amount:a,date:dt,distributionKey:document.getElementById('f5').value,invoiceNo:document.getElementById('f6').value.trim()};if(eid){const i=S.costs.findIndex(x=>x.id===eid);S.costs[i]={...S.costs[i],...data}}else S.costs.push({id:gid(),...data});sd(S);cm()}}
function sDKF(){mc=`<h2 class="modal-title">Neuer Verteilerschlüssel</h2><div class="form-grid"><div class="form-group"><label class="form-label">Name <span class="req">*</span></label><input class="form-input" id="f1"></div><div class="form-group"><label class="form-label">Berechnungsgrundlage</label><input class="form-input" id="f2"></div><div class="form-group full"><label class="form-label">Beschreibung</label><textarea class="form-textarea" id="f3"></textarea></div></div><div class="form-actions"><button class="btn btn-primary" id="sv">Anlegen</button><button class="btn btn-secondary" onclick="cm()">Abbrechen</button></div>`;render();document.getElementById('sv').onclick=()=>{const n=document.getElementById('f1').value.trim();if(!n)return alert('Name!');if(!S.customDistKeys)S.customDistKeys=[];S.customDistKeys.push({id:gid(),name:n,basis:document.getElementById('f2').value.trim(),description:document.getElementById('f3').value.trim()});sd(S);cm()}}

// ============ EVENTS ============
function ae(){document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pv=null;render()});const tb=document.getElementById('tsb');if(tb)tb.onclick=()=>{sc=!sc;render()};const mo=document.getElementById('mo');if(mo)mo.onclick=e=>{if(e.target===mo)cm()};
// Backup
const eb=document.getElementById('expBtn');if(eb)eb.onclick=exportBackup;
const ib=document.getElementById('impBtn');if(ib)ib.onclick=()=>document.getElementById('ifi').click();
const iz=document.getElementById('iz');if(iz){iz.onclick=()=>document.getElementById('ifi').click();iz.ondragover=e=>{e.preventDefault();iz.classList.add('dragover')};iz.ondragleave=()=>iz.classList.remove('dragover');iz.ondrop=e=>{e.preventDefault();iz.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)importBackup(f)}}
const fi=document.getElementById('ifi');if(fi)fi.onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};
// Property
const sp=document.getElementById('sp');if(sp)sp.onclick=()=>{if(!S.property)S.property={};const t=window._pt||'o';if(t==='o'){S.property.name=document.getElementById('pn').value.trim();S.property.yearBuilt=document.getElementById('py').value;S.property.address=document.getElementById('pa').value.trim();S.property.landArea=document.getElementById('pl').value;S.property.landRegistry=document.getElementById('pr').value.trim();S.property.notes=document.getElementById('pno').value.trim()}else{S.property.owner=document.getElementById('po').value.trim();S.property.ownerAdd=document.getElementById('poa').value.trim();S.property.ownerAddress=document.getElementById('poad').value.trim();S.property.phone=document.getElementById('pp').value.trim();S.property.email=document.getElementById('pe').value.trim();S.property.taxId=document.getElementById('pti').value.trim();S.property.bank=document.getElementById('pb').value.trim();S.property.bankName=document.getElementById('pbn').value.trim()}if(!S.property.name||!S.property.address)return alert('Pflichtfelder!');sd(S);render();alert('Gespeichert!')};
// Units
const au=document.getElementById('aub');if(au)au.onclick=()=>sUF(null);document.querySelectorAll('[data-eu]').forEach(b=>b.onclick=()=>sUF(b.dataset.eu));document.querySelectorAll('[data-du]').forEach(b=>b.onclick=()=>{if(confirm('Löschen?')){S.units=S.units.filter(u=>u.id!==b.dataset.du);S.tenants=S.tenants.filter(t=>t.unitId!==b.dataset.du);sd(S);render()}});
// Tenants
const at=document.getElementById('atb');if(at&&S.units.length>0)at.onclick=()=>sTF(null);document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>sTF(b.dataset.et));document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{if(confirm('Löschen?')){S.tenants=S.tenants.filter(t=>t.id!==b.dataset.dt);sd(S);render()}});
// Prepayments
const ap=document.getElementById('apb');if(ap&&S.tenants.length>0)ap.onclick=()=>sPF(null);document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>sPF(b.dataset.ep));document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{if(confirm('Löschen?')){S.prepayments=S.prepayments.filter(p=>p.id!==b.dataset.dp);sd(S);render()}});
// Costs
const ac=document.getElementById('acb');if(ac)ac.onclick=()=>sCF(null);document.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{cf=b.dataset.flt;render()});document.querySelectorAll('[data-ec]').forEach(b=>b.onclick=()=>sCF(b.dataset.ec));document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{if(confirm('Löschen?')){S.costs=S.costs.filter(c=>c.id!==b.dataset.dc);sd(S);render()}});
// Copy costs
const cc=document.getElementById('ccb');if(cc)cc.onclick=()=>{const ys=[...new Set(S.costs.map(c=>new Date(c.date).getFullYear()))].sort();if(!ys.length)return alert('Keine Kosten');const fy=ys[ys.length-1],ty=fy+1,src=S.costs.filter(c=>new Date(c.date).getFullYear()===fy);if(!src.length)return alert('Keine Kosten '+fy);if(!confirm(src.length+' Kosten von '+fy+' nach '+ty+' kopieren?'))return;src.forEach(c=>{S.costs.push({id:gid(),category:c.category,description:c.description,amount:c.amount,date:ty+'-01-01',distributionKey:c.distributionKey,invoiceNo:''})});sd(S);render();alert(src.length+' Kosten kopiert!')};
const cyb=document.getElementById('ccyb');if(cyb)cyb.onclick=()=>{const fy=document.getElementById('cfy').value,ty=document.getElementById('cty').value,nd=document.getElementById('cnd').value,src=S.costs.filter(c=>new Date(c.date).getFullYear().toString()===fy);if(!src.length)return alert('Keine Kosten');if(!confirm(src.length+' Kosten kopieren?'))return;src.forEach(c=>{S.costs.push({id:gid(),category:c.category,description:c.description,amount:c.amount,date:nd,distributionKey:c.distributionKey,invoiceNo:''})});sd(S);render();alert(src.length+' Kosten nach '+ty+' kopiert!')};
// DistKeys
const adk2=document.getElementById('adkb');if(adk2)adk2.onclick=()=>sDKF();document.querySelectorAll('[data-ddk]').forEach(b=>b.onclick=()=>{S.customDistKeys=(S.customDistKeys||[]).filter(k=>k.id!==b.dataset.ddk);sd(S);render()});
// Settlement
const ys=document.getElementById('ys');if(ys)ys.onchange=()=>{sy=ys.value;pv=null;render()};const pa=document.getElementById('pab');if(pa)pa.onclick=()=>{pv={type:'all',year:sy};render();setTimeout(()=>window.scrollTo(0,0),100)};const ab=document.getElementById('archbtn');if(ab)ab.onclick=()=>{pv={type:'archive',year:sy};render();setTimeout(()=>window.scrollTo(0,0),100)};document.querySelectorAll('[data-pdt]').forEach(b=>b.onclick=()=>{pv={type:'tenant',tid:b.dataset.pdt,year:sy};render();setTimeout(()=>window.scrollTo(0,0),100)});
// Protokoll
const pys=document.getElementById('pys');if(pys)pys.onchange=()=>{sy=pys.value;render()};const ppb=document.getElementById('ppb');if(ppb)ppb.onclick=()=>{pv={type:'protokoll',year:sy};render();setTimeout(()=>window.scrollTo(0,0),100)}}
render();
</script>
</body>
</html>
