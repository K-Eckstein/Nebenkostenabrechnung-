<!DOCTYPE html>
<html lang="de">
<head>

</head>
<body>
    <div id="app"></div>

    <script>
        // ============ DATENMODELL ============
        const STORAGE_KEY = 'nebenkosten_v4';
        
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) { console.error(e); }
            return {
                property: null,
                units: [],
                tenants: [],
                costs: [],
                customDistKeys: [],
                prepayments: [], // { tenantId, monthlyAmount, startDate, endDate }
            };
        }
        
        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        let state = loadData();
        let activeTab = 'dashboard';
        let sidebarCollapsed = false;
        let modalContent = null;
        
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
        
        function formatCurrency(amount) {
            return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '—';
            return new Date(dateStr).toLocaleDateString('de-DE');
        }
        
        // ============ BETRKV KONFORME KATEGORIEN ============
        const COST_CATEGORIES = {
            heating: { label: 'Heizung', betrkv: true, heizkostenV: true, desc: 'Betriebskosten der zentralen Heizungsanlage (§ 1 HeizkostenV)' },
            hot_water: { label: 'Warmwasser', betrkv: true, heizkostenV: true, desc: 'Betriebskosten der zentralen Warmwasserversorgung (§ 1 HeizkostenV)' },
            water: { label: 'Kaltwasser', betrkv: true, desc: 'Wasserversorgung (§ 2 BetrKV Nr. 2)' },
            sewage: { label: 'Abwasser', betrkv: true, desc: 'Entwässerung (§ 2 BetrKV Nr. 2)' },
            garbage: { label: 'Müllabfuhr', betrkv: true, desc: 'Abfallbeseitigung (§ 2 BetrKV Nr. 8)' },
            electricity_common: { label: 'Allgemeinstrom', betrkv: true, desc: 'Strom für Allgemeinflächen (§ 2 BetrKV Nr. 1)' },
            insurance: { label: 'Versicherungen', betrkv: true, desc: 'Versicherungen (§ 2 BetrKV Nr. 13)' },
            maintenance: { label: 'Instandhaltung', betrkv: false, desc: 'ACHTUNG: Nicht umlegbar! (§ 555a BGB - Vermieteranteil)' },
            property_tax: { label: 'Grundsteuer', betrkv: true, desc: 'Grundsteuer (§ 2 BetrKV Nr. 1)' },
            cleaning: { label: 'Reinigung', betrkv: true, desc: 'Treppenreinigung, Gartenpflege (§ 2 BetrKV Nr. 3,4)' },
            gardening: { label: 'Gartenpflege', betrkv: true, desc: 'Pflege der Außenanlagen (§ 2 BetrKV Nr. 10)' },
            elevator: { label: 'Aufzug', betrkv: true, desc: 'Betriebskosten Aufzug (§ 2 BetrKV Nr. 14)' },
            chimney: { label: 'Schornsteinfeger', betrkv: true, desc: 'Schornsteinfeger (§ 2 BetrKV Nr. 6)' },
            pest_control: { label: 'Schädlingsbekämpfung', betrkv: true, desc: 'Schädlingsbekämpfung (§ 2 BetrKV Nr. 7)' },
            cable_tv: { label: 'Kabel-TV', betrkv: true, desc: 'Betriebskosten der Breitbandkommunikation (§ 2 BetrKV Nr. 15)' },
            other: { label: 'Sonstiges', betrkv: true, desc: 'Sonstige Betriebskosten' },
        };
        
        const STANDARD_DIST_KEYS = {
            area: 'Nach Wohnfläche (m²)',
            persons: 'Nach Personenzahl',
            units: 'Nach Wohneinheiten',
            consumption: 'Nach Verbrauch',
        };
        
        function getAllDistKeys() {
            const keys = { ...STANDARD_DIST_KEYS };
            (state.customDistKeys || []).forEach(k => { keys[k.id] = k.name; });
            return keys;
        }
        
        // ============ BERECHNUNGEN ============
        function isUnitVacant(unitId, costDate) {
            const activeTenants = state.tenants.filter(t => {
                if (t.unitId !== unitId) return false;
                const d = new Date(costDate);
                const moveIn = new Date(t.moveInDate);
                const moveOut = t.moveOutDate ? new Date(t.moveOutDate) : null;
                if (moveOut && d > moveOut) return false;
                if (d < moveIn) return false;
                return true;
            });
            return activeTenants.length === 0;
        }
        
        function calculatePrepayments(tenantId, year) {
            const prepayments = state.prepayments.filter(p => p.tenantId === tenantId);
            if (prepayments.length === 0) return 0;
            
            const yearStart = new Date(year + '-01-01');
            const yearEnd = new Date(year + '-12-31');
            let total = 0;
            
            for (const p of prepayments) {
                const startDate = new Date(p.startDate);
                const endDate = p.endDate ? new Date(p.endDate) : yearEnd;
                
                // Berechne Monate im Abrechnungszeitraum
                const effectiveStart = startDate > yearStart ? startDate : yearStart;
                const effectiveEnd = endDate < yearEnd ? endDate : yearEnd;
                
                if (effectiveStart > effectiveEnd) continue;
                
                const months = (effectiveEnd.getFullYear() - effectiveStart.getFullYear()) * 12 + 
                              (effectiveEnd.getMonth() - effectiveStart.getMonth()) + 1;
                
                total += p.monthlyAmount * months;
            }
            
            return total;
        }
        
        function calculateSettlement(year) {
            const filteredCosts = state.costs.filter(c => new Date(c.date).getFullYear().toString() === year);
            const totalCosts = filteredCosts.reduce((s, c) => s + c.amount, 0);
            
            let vacantCosts = 0;
            let occupiedCosts = 0;
            
            const umlegbarCosts = filteredCosts.filter(c => COST_CATEGORIES[c.category]?.betrkv !== false);
            const nichtUmlagbar = filteredCosts.filter(c => COST_CATEGORIES[c.category]?.betrkv === false);
            
            const distributions = [];
            
            for (const cost of umlegbarCosts) {
                const occupiedUnits = state.units.filter(u => !isUnitVacant(u.id, cost.date));
                
                if (occupiedUnits.length === 0) {
                    vacantCosts += cost.amount;
                    continue;
                }
                
                const allUnits = state.units;
                const occupiedArea = occupiedUnits.reduce((s, u) => s + u.size, 0);
                const totalArea = allUnits.reduce((s, u) => s + u.size, 0);
                
                const occupiedShare = cost.distributionKey === 'area' ? occupiedArea / totalArea : 1;
                const umlageFähig = cost.amount * occupiedShare;
                const vacantShare = cost.amount - umlageFähig;
                
                vacantCosts += vacantShare;
                occupiedCosts += umlageFähig;
                
                const activeTenants = state.tenants.filter(t => {
                    const unit = state.units.find(u => u.id === t.unitId);
                    if (!unit) return false;
                    const d = new Date(cost.date);
                    const moveIn = new Date(t.moveInDate);
                    const moveOut = t.moveOutDate ? new Date(t.moveOutDate) : null;
                    if (moveOut && d > moveOut) return false;
                    if (d < moveIn) return false;
                    return true;
                });
                
                let totalWeight = 0;
                for (const tenant of activeTenants) {
                    const unit = state.units.find(u => u.id === tenant.unitId);
                    if (!unit) continue;
                    let weight = 1;
                    if (cost.distributionKey === 'area') weight = unit.size;
                    totalWeight += weight;
                }
                
                if (totalWeight === 0) continue;
                
                for (const tenant of activeTenants) {
                    const unit = state.units.find(u => u.id === tenant.unitId);
                    if (!unit) continue;
                    let weight = 1;
                    if (cost.distributionKey === 'area') weight = unit.size;
                    const share = weight / totalWeight;
                    const amount = Math.round(umlageFähig * share * 100) / 100;
                    
                    distributions.push({
                        tenantId: tenant.id,
                        tenantName: tenant.name,
                        unitId: unit.id,
                        unitName: unit.name,
                        category: cost.category,
                        amount: amount,
                        share: Math.round(share * 10000) / 100,
                    });
                }
            }
            
            const vacantUnits = state.units.filter(u => {
                return state.tenants.filter(t => {
                    if (t.unitId !== u.id) return false;
                    const now = new Date(year + '-12-31');
                    const yearStart = new Date(year + '-01-01');
                    const moveIn = new Date(t.moveInDate);
                    const moveOut = t.moveOutDate ? new Date(t.moveOutDate) : null;
                    if (moveOut && yearStart > moveOut) return false;
                    if (moveIn > now) return false;
                    return true;
                }).length === 0;
            });
            
            return {
                totalCosts,
                umlegbarCosts: umlegbarCosts.reduce((s, c) => s + c.amount, 0),
                nichtUmlagbar: nichtUmlagbar.reduce((s, c) => s + c.amount, 0),
                vacantCosts,
                occupiedCosts,
                distributions,
                vacantUnits,
                costsByCategory: getCostsByCategory(umlegbarCosts),
                allCostsByCategory: getCostsByCategory(filteredCosts),
            };
        }
        
        function getCostsByCategory(costs) {
            const result = {};
            costs.forEach(c => { result[c.category] = (result[c.category] || 0) + c.amount; });
            return result;
        }

        // ============ DASHBOARD ============
        function renderDashboard() {
            const totalCosts = state.costs.reduce((s,c) => s + c.amount, 0);

            const yearTotal = yearCosts.reduce((s,c) => s + c.amount, 0);

            return `

                </div>

                            ${(() => {
                                const byCat = getCostsByCategory(state.costs);
                                const sorted = Object.entries(byCat).sort((a,b) => b[1]-a[1]).slice(0,6);

                                return sorted.map(([cat, amount]) => {

                                    return `
                                        <div style="margin-bottom:10px;">
                                            <div class="progress-label">
                                                <span>${COST_CATEGORIES[cat]?.label || cat} ${isNotUmlagbar ? '<span class="badge badge-red">Nicht umlegbar</span>' : ''}</span>
                                                <span>${formatCurrency(amount)}</span>
                                            </div>
                                            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%; ${isNotUmlagbar ? 'background:linear-gradient(90deg,#ef4444,#dc2626)' : ''}"></div></div>
                                        </div>

            years.sort().reverse();
            
            const result = calculateSettlement(settlementYear);
            const filteredCosts = state.costs.filter(c => new Date(c.date).getFullYear().toString() === settlementYear);
            
            // Group by tenant

                tenantTotals[d.tenantId].categories[d.category] = (tenantTotals[d.tenantId].categories[d.category] || 0) + d.amount;
                tenantTotals[d.tenantId].total += d.amount;

            // Add prepayments and balance
            Object.keys(tenantTotals).forEach(tId => {
                const prepayments = calculatePrepayments(tId, settlementYear);
                tenantTotals[tId].prepayments = prepayments;
                tenantTotals[tId].balance = prepayments - tenantTotals[tId].total; // positive = Guthaben, negative = Nachzahlung
            });

            const avgPerTenant = Object.keys(tenantTotals).length > 0 ? result.occupiedCosts / Object.keys(tenantTotals).length : 0;

                                Leerstandskosten wurden nicht auf Sie umgelegt (§ 556a BGB). 
                                Die Abrechnungsfrist beträgt 12 Monate nach Ende des Abrechnungszeitraums.
                                ${result.nichtUmlagbar > 0 ? ' Nicht umlegbare Kosten (z.B. Instandhaltung) sind nicht enthalten.' : ''}
                            </p>
                            <p style="margin-top:10px;">
                                ${state.property?.address || ''}, den ${new Date().toLocaleDateString('de-DE')}<br><br>
                                _________________________________________<br>
                                ${state.property?.owner || 'Eigentümer'}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function closePdfPreview() {
            pdfTenantId = null;
            render();
        }
        
        // ============ MODAL ============
        function renderModal() {
            return `
                <div class="modal-overlay" id="modalOverlay">
                    <div class="modal">
                        ${modalContent}
                    </div>
                </div>
            `;
        }
        
        function closeModal() { modalContent = null; render(); }
        
        // ============ FORMULARE ============
        function showUnitForm(editId) {
            const unit = editId ? state.units.find(u => u.id === editId) : null;
            modalContent = `
                <h2 class="modal-title">${unit ? 'Einheit bearbeiten' : 'Neue Wohneinheit'}</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Bezeichnung <span class="req">*</span></label>
                        <input class="form-input" id="mUnitName" value="${unit?.name || ''}" placeholder="z.B. Whg. 1.1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fläche (m²) <span class="req">*</span></label>
                        <input class="form-input" type="number" id="mUnitSize" value="${unit?.size || ''}" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Zimmer</label>
                        <input class="form-input" type="number" id="mUnitRooms" value="${unit?.rooms || ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Etage</label>
                        <input class="form-input" type="number" id="mUnitFloor" value="${unit?.floor || ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Einheitentyp</label>
                        <select class="form-input" id="mUnitType">
                            <option value="Wohnung" ${unit?.type === 'Wohnung' ? 'selected' : ''}>Wohnung</option>
                            <option value="Gewerbe" ${unit?.type === 'Gewerbe' ? 'selected' : ''}>Gewerbe</option>
                            <option value="Stellplatz" ${unit?.type === 'Stellplatz' ? 'selected' : ''}>Stellplatz</option>
                            <option value="Keller" ${unit?.type === 'Keller' ? 'selected' : ''}>Keller</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Heizungsart</label>
                        <select class="form-input" id="mUnitHeating">
                            <option value="Zentral" ${unit?.heatingType === 'Zentral' ? 'selected' : ''}>Zentral</option>
                            <option value="Etagen" ${unit?.heatingType === 'Etagen' ? 'selected' : ''}>Etagenheizung</option>
                            <option value="Fernwärme" ${unit?.heatingType === 'Fernwärme' ? 'selected' : ''}>Fernwärme</option>
                            <option value="Keine" ${unit?.heatingType === 'Keine' ? 'selected' : ''}>Keine</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" id="saveUnitModal" data-id="${editId || ''}">${unit ? 'Speichern' : 'Anlegen'}</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
                </div>
            `;
            render();
            document.getElementById('saveUnitModal').onclick = () => {
                const name = document.getElementById('mUnitName').value.trim();
                const size = parseFloat(document.getElementById('mUnitSize').value);
                const rooms = parseInt(document.getElementById('mUnitRooms').value) || 0;
                const floor = parseInt(document.getElementById('mUnitFloor').value) || 0;
                const type = document.getElementById('mUnitType').value;
                const heatingType = document.getElementById('mUnitHeating').value;
                if (!name || !size) return alert('Bitte Bezeichnung und Fläche ausfüllen.');
                if (editId) {
                    const idx = state.units.findIndex(u => u.id === editId);
                    state.units[idx] = { ...state.units[idx], name, size, rooms, floor, type, heatingType };
                } else {
                    state.units.push({ id: generateId(), name, size, rooms, floor, type, heatingType });
                }
                saveData(state);
                closeModal();
            };
        }
        
        function showTenantForm(editId) {
            const tenant = editId ? state.tenants.find(t => t.id === editId) : null;
            modalContent = `
                <h2 class="modal-title">${tenant ? 'Mieter bearbeiten' : 'Neuer Mieter'}</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Name <span class="req">*</span></label>
                        <input class="form-input" id="mTenantName" value="${tenant?.name || ''}" placeholder="Vor- und Nachname">
                    </div>
                    <div class="form-group">
                        <label class="form-label">E-Mail</label>
                        <input class="form-input" type="email" id="mTenantEmail" value="${tenant?.email || ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telefon</label>
                        <input class="form-input" id="mTenantPhone" value="${tenant?.phone || ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Wohneinheit <span class="req">*</span></label>
                        <select class="form-input" id="mTenantUnit">
                            <option value="">Bitte wählen...</option>
                            ${state.units.map(u => `<option value="${u.id}" ${tenant?.unitId === u.id ? 'selected' : ''}>${u.name} (${u.size} m²)</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Einzugsdatum <span class="req">*</span></label>
                        <input class="form-input" type="date" id="mTenantMoveIn" value="${tenant?.moveInDate || ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Auszugsdatum</label>
                        <input class="form-input" type="date" id="mTenantMoveOut" value="${tenant?.moveOutDate || ''}">
                        <div class="form-hint">Leer = Mieter wohnt noch</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" id="saveTenantModal" data-id="${editId || ''}">${tenant ? 'Speichern' : 'Anlegen'}</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
                </div>
            `;
            render();
            document.getElementById('saveTenantModal').onclick = () => {
                const name = document.getElementById('mTenantName').value.trim();
                const email = document.getElementById('mTenantEmail').value.trim();
                const phone = document.getElementById('mTenantPhone').value.trim();
                const unitId = document.getElementById('mTenantUnit').value;
                const moveInDate = document.getElementById('mTenantMoveIn').value;
                const moveOutDate = document.getElementById('mTenantMoveOut').value || null;
                if (!name || !unitId || !moveInDate) return alert('Bitte alle Pflichtfelder ausfüllen.');
                if (editId) {
                    const idx = state.tenants.findIndex(t => t.id === editId);
                    state.tenants[idx] = { ...state.tenants[idx], name, email, phone, unitId, moveInDate, moveOutDate };
                } else {
                    state.tenants.push({ id: generateId(), name, email, phone, unitId, moveInDate, moveOutDate });
                }
                saveData(state);
                closeModal();
            };
        }
        
        function showPrepayForm(editId) {
            const prepay = editId ? state.prepayments.find(p => p.id === editId) : null;
            modalContent = `
                <h2 class="modal-title">${prepay ? 'Vorauszahlung bearbeiten' : 'Neue Vorauszahlung'}</h2>
                <div class="form-grid">
                    <div class="form-group full">
                        <label class="form-label">Mieter <span class="req">*</span></label>
                        <select class="form-input" id="mPrepayTenant">
                            <option value="">Bitte wählen...</option>
                            ${state.tenants.map(t => {
                                const unit = state.units.find(u => u.id === t.unitId);
                                return `<option value="${t.id}" ${prepay?.tenantId === t.id ? 'selected' : ''}>${t.name} (${unit?.name || '—'})</option>`;
                            }).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Monatlicher Betrag (€) <span class="req">*</span></label>
                        <input class="form-input" type="number" id="mPrepayAmount" value="${prepay?.monthlyAmount || ''}" step="0.01" min="0" placeholder="z.B. 150.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Startdatum <span class="req">*</span></label>
                        <input class="form-input" type="date" id="mPrepayStart" value="${prepay?.startDate || new Date().getFullYear() + '-01-01'}">
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Enddatum (optional)</label>
                        <input class="form-input" type="date" id="mPrepayEnd" value="${prepay?.endDate || ''}">
                        <div class="form-hint">Leer = Vorauszahlung läuft unbefristet</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" id="savePrepayModal">${prepay ? 'Speichern' : 'Anlegen'}</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
                </div>
            `;
            render();
            document.getElementById('savePrepayModal').onclick = () => {
                const tenantId = document.getElementById('mPrepayTenant').value;
                const monthlyAmount = parseFloat(document.getElementById('mPrepayAmount').value);
                const startDate = document.getElementById('mPrepayStart').value;
                const endDate = document.getElementById('mPrepayEnd').value || null;
                if (!tenantId || !monthlyAmount || !startDate) return alert('Bitte alle Pflichtfelder ausfüllen.');
                if (editId) {
                    const idx = state.prepayments.findIndex(p => p.id === editId);
                    state.prepayments[idx] = { ...state.prepayments[idx], tenantId, monthlyAmount, startDate, endDate };
                } else {
                    state.prepayments.push({ id: generateId(), tenantId, monthlyAmount, startDate, endDate });
                }
                saveData(state);
                closeModal();
            };
        }
        
        function showCostForm(editId) {
            const cost = editId ? state.costs.find(c => c.id === editId) : null;
            const allKeys = getAllDistKeys();
            modalContent = `
                <h2 class="modal-title">${cost ? 'Kosten bearbeiten' : 'Neue Kosten erfassen'}</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Kategorie <span class="req">*</span></label>
                        <select class="form-input" id="mCostCat">
                            ${Object.entries(COST_CATEGORIES).map(([k,v]) => `<option value="${k}" ${cost?.category === k ? 'selected' : ''}>${v.label}${v.betrkv === false ? ' ⚠ Nicht umlegbar' : ''}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Beschreibung <span class="req">*</span></label>
                        <input class="form-input" id="mCostDesc" value="${cost?.description || ''}" placeholder="z.B. Gasrechnung Q1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Betrag (€) <span class="req">*</span></label>
                        <input class="form-input" type="number" id="mCostAmount" value="${cost?.amount || ''}" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Datum <span class="req">*</span></label>
                        <input class="form-input" type="date" id="mCostDate" value="${cost?.date || new Date().toISOString().split('T')[0]}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Verteilerschlüssel <span class="req">*</span></label>
                        <select class="form-input" id="mCostDistKey">
                            ${Object.entries(allKeys).map(([k,v]) => `<option value="${k}" ${cost?.distributionKey === k ? 'selected' : ''}>${v}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Rechnungsnummer</label>
                        <input class="form-input" id="mCostInvoice" value="${cost?.invoiceNo || ''}" placeholder="Optional">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-warning" id="saveCostModal" data-id="${editId || ''}">${cost ? 'Speichern' : 'Anlegen'}</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
                </div>
            `;
            render();
            document.getElementById('saveCostModal').onclick = () => {
                const category = document.getElementById('mCostCat').value;
                const description = document.getElementById('mCostDesc').value.trim();
                const amount = parseFloat(document.getElementById('mCostAmount').value);
                const date = document.getElementById('mCostDate').value;
                const distributionKey = document.getElementById('mCostDistKey').value;
                const invoiceNo = document.getElementById('mCostInvoice').value.trim();
                if (!description || !amount || !date) return alert('Bitte alle Pflichtfelder ausfüllen.');
                if (editId) {
                    const idx = state.costs.findIndex(c => c.id === editId);
                    state.costs[idx] = { ...state.costs[idx], category, description, amount, date, distributionKey, invoiceNo };
                } else {
                    state.costs.push({ id: generateId(), category, description, amount, date, distributionKey, invoiceNo });
                }
                saveData(state);
                closeModal();
            };
        }
        
        function showDistKeyForm() {
            modalContent = `
                <h2 class="modal-title">Neuer Verteilerschlüssel</h2>
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <div>Definieren Sie einen eigenen Verteilerschlüssel für die Kostenverteilung. Dieser muss im Mietvertrag vereinbart werden.</div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Name <span class="req">*</span></label>
                        <input class="form-input" id="mDkName" placeholder="z.B. Nach Mietanteil">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Berechnungsgrundlage</label>
                        <input class="form-input" id="mDkBasis" placeholder="z.B. Mietzins, Anteil an Gesamtfläche">
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Beschreibung</label>
                        <textarea class="form-textarea" id="mDkDesc" placeholder="Beschreibung des Verteilverfahrens..."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" id="saveDkModal">Anlegen</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
                </div>
            `;
            render();
            document.getElementById('saveDkModal').onclick = () => {
                const name = document.getElementById('mDkName').value.trim();
                const basis = document.getElementById('mDkBasis').value.trim();
                const description = document.getElementById('mDkDesc').value.trim();
                if (!name) return alert('Bitte Name eingeben.');
                if (!state.customDistKeys) state.customDistKeys = [];
                state.customDistKeys.push({ id: generateId(), name, basis, description });
                saveData(state);
                closeModal();
            };
        }
        
        // ============ EVENTS ============
        function attachEvents() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.onclick = () => { activeTab = btn.dataset.tab; pdfTenantId = null; render(); };
            });
            const toggleBtn = document.getElementById('toggleSidebar');
            if (toggleBtn) toggleBtn.onclick = () => { sidebarCollapsed = !sidebarCollapsed; render(); };
            
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay) modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };
            
            // Property
            const savePropBtn = document.getElementById('savePropertyBtn');
            if (savePropBtn) savePropBtn.onclick = () => {
                state.property = {
                    name: document.getElementById('propName').value.trim(),
                    owner: document.getElementById('propOwner').value.trim(),
                    address: document.getElementById('propAddress').value.trim(),
                    yearBuilt: document.getElementById('propYear').value,
                    landArea: document.getElementById('propLandArea').value,
                    totalArea: document.getElementById('propTotalArea').value || state.units.reduce((s,u) => s + u.size, 0),
                    landRegistry: document.getElementById('propLandRegistry').value.trim(),
                    phone: document.getElementById('propPhone').value.trim(),
                    email: document.getElementById('propEmail').value.trim(),
                    taxId: document.getElementById('propTaxId').value.trim(),
                    bank: document.getElementById('propBank').value.trim(),
                    notes: document.getElementById('propNotes').value.trim(),
                };
                if (!state.property.name || !state.property.owner || !state.property.address) {
                    return alert('Bitte mindestens Objektbezeichnung, Eigentümer und Adresse ausfüllen.');
                }
                saveData(state);
                render();
                alert('Objektdaten gespeichert!');
            };
            
            // Units
            const addUnitBtn = document.getElementById('addUnitBtn');
            if (addUnitBtn) addUnitBtn.onclick = () => showUnitForm(null);
            document.querySelectorAll('[data-edit-unit]').forEach(btn => btn.onclick = () => showUnitForm(btn.dataset.editUnit));
            document.querySelectorAll('[data-delete-unit]').forEach(btn => btn.onclick = () => {
                if (confirm('Einheit und zugehörige Mieter löschen?')) {
                    state.units = state.units.filter(u => u.id !== btn.dataset.deleteUnit);
                    state.tenants = state.tenants.filter(t => t.unitId !== btn.dataset.deleteUnit);
                    saveData(state); render();
                }
            });
            
            // Tenants
            const addTenantBtn = document.getElementById('addTenantBtn');
            if (addTenantBtn && state.units.length > 0) addTenantBtn.onclick = () => showTenantForm(null);
            document.querySelectorAll('[data-edit-tenant]').forEach(btn => btn.onclick = () => showTenantForm(btn.dataset.editTenant));
            document.querySelectorAll('[data-delete-tenant]').forEach(btn => btn.onclick = () => {
                if (confirm('Mieter löschen?')) { state.tenants = state.tenants.filter(t => t.id !== btn.dataset.deleteTenant); saveData(state); render(); }
            });
            
            // Prepayments
            const addPrepayBtn = document.getElementById('addPrepayBtn');
            if (addPrepayBtn && state.tenants.length > 0) addPrepayBtn.onclick = () => showPrepayForm(null);
            document.querySelectorAll('[data-edit-prepay]').forEach(btn => btn.onclick = () => showPrepayForm(btn.dataset.editPrepay));
            document.querySelectorAll('[data-delete-prepay]').forEach(btn => btn.onclick = () => {
                if (confirm('Vorauszahlung löschen?')) { state.prepayments = state.prepayments.filter(p => p.id !== btn.dataset.deletePrepay); saveData(state); render(); }
            });
            
            // Costs
            const addCostBtn = document.getElementById('addCostBtn');
            if (addCostBtn) addCostBtn.onclick = () => showCostForm(null);
            document.querySelectorAll('[data-filter]').forEach(btn => btn.onclick = () => { costFilter = btn.dataset.filter; render(); });
            document.querySelectorAll('[data-edit-cost]').forEach(btn => btn.onclick = () => showCostForm(btn.dataset.editCost));
            document.querySelectorAll('[data-delete-cost]').forEach(btn => btn.onclick = () => {
                if (confirm('Kostenposition löschen?')) { state.costs = state.costs.filter(c => c.id !== btn.dataset.deleteCost); saveData(state); render(); }
            });
            
            // Dist Keys
            const addDkBtn = document.getElementById('addDistKeyBtn');
            if (addDkBtn) addDkBtn.onclick = () => showDistKeyForm();
            document.querySelectorAll('[data-delete-dk]').forEach(btn => btn.onclick = () => {
                state.customDistKeys = (state.customDistKeys || []).filter(k => k.id !== btn.dataset.deleteDk);
                saveData(state); render();
            });
            
            // Settlement
            const yearSelect = document.getElementById('yearSelect');
            if (yearSelect) yearSelect.onchange = () => { settlementYear = yearSelect.value; pdfTenantId = null; render(); };
            const printBtn = document.getElementById('printBtn');
            if (printBtn) printBtn.onclick = () => window.print();
            
            // PDF per tenant
            document.querySelectorAll('[data-pdf-tenant]').forEach(btn => btn.onclick = () => {
                pdfTenantId = btn.dataset.pdfTenant;
                render();
                // Scroll to PDF
                setTimeout(() => {
                    const pdfEl = document.querySelector('.pdf-print');
                    if (pdfEl) pdfEl.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            });
        }
        
        // Initial render
        render();
    </script>
</body>
</html>
