<body>
    <div id="app"></div>

    <script>
        const STORAGE_KEY = 'nebenkosten_v5';
        
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) { console.error(e); }
            return { property: null, units: [], tenants: [], costs: [], customDistKeys: [], prepayments: [] };
        }
        
        function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        
        let state = loadData();
        let activeTab = 'dashboard';
        let sidebarCollapsed = false;
        let modalContent = null;
        let pdfView = null; // { type: 'tenant'|'protokoll', tenantId?: string, year: string }
        
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function formatCurrency(a) { return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(a); }
        function formatDate(d) { return d ? new Date(d).toLocaleDateString('de-DE') : '—'; }
        
        const COST_CATEGORIES = {
            heating: { label: 'Heizung', betrkv: true, heizkostenV: true },
            hot_water: { label: 'Warmwasser', betrkv: true, heizkostenV: true },
            water: { label: 'Kaltwasser', betrkv: true },
            sewage: { label: 'Abwasser', betrkv: true },
            garbage: { label: 'Müllabfuhr', betrkv: true },
            electricity_common: { label: 'Allgemeinstrom', betrkv: true },
            insurance: { label: 'Versicherungen', betrkv: true },
            maintenance: { label: 'Instandhaltung', betrkv: false },
            property_tax: { label: 'Grundsteuer', betrkv: true },
            cleaning: { label: 'Reinigung', betrkv: true },
            gardening: { label: 'Gartenpflege', betrkv: true },
            elevator: { label: 'Aufzug', betrkv: true },
            chimney: { label: 'Schornsteinfeger', betrkv: true },
            pest_control: { label: 'Schädlingsbekämpfung', betrkv: true },
            cable_tv: { label: 'Kabel-TV', betrkv: true },
            other: { label: 'Sonstiges', betrkv: true },
        };
        
        const STANDARD_DIST_KEYS = {
            area: 'Nach Wohnfläche (m²)', persons: 'Nach Personenzahl',
            units: 'Nach Wohneinheiten', consumption: 'Nach Verbrauch',
        };
        
        function getAllDistKeys() {
            const keys = { ...STANDARD_DIST_KEYS };
            (state.customDistKeys || []).forEach(k => { keys[k.id] = k.name; });
            return keys;
        }
        
        function isUnitVacant(unitId, costDate) {
            return state.tenants.filter(t => {
                if (t.unitId !== unitId) return false;
                const d = new Date(costDate), mi = new Date(t.moveInDate);
                const mo = t.moveOutDate ? new Date(t.moveOutDate) : null;
                if (mo && d > mo) return false;
                if (d < mi) return false;
                return true;
            }).length === 0;
        }
        
        function calculatePrepayments(tenantId, year) {
            const preps = state.prepayments.filter(p => p.tenantId === tenantId);
            if (preps.length === 0) return 0;
            const ys = new Date(year + '-01-01'), ye = new Date(year + '-12-31');
            let total = 0;
            for (const p of preps) {
                const sd = new Date(p.startDate), ed = p.endDate ? new Date(p.endDate) : ye;
                const es = sd > ys ? sd : ys, ee = ed < ye ? ed : ye;
                if (es > ee) continue;
                const months = (ee.getFullYear() - es.getFullYear()) * 12 + (ee.getMonth() - es.getMonth()) + 1;
                total += p.monthlyAmount * months;
            }
            return total;
        }
        
        function calculateSettlement(year) {
            const fc = state.costs.filter(c => new Date(c.date).getFullYear().toString() === year);
            const umlegbar = fc.filter(c => COST_CATEGORIES[c.category]?.betrkv !== false);
            const nichtUmlagbar = fc.filter(c => COST_CATEGORIES[c.category]?.betrkv === false);
            let vacantCosts = 0, occupiedCosts = 0;
            const distributions = [];
            
            for (const cost of umlegbar) {
                const occUnits = state.units.filter(u => !isUnitVacant(u.id, cost.date));
                if (occUnits.length === 0) { vacantCosts += cost.amount; continue; }
                const occArea = occUnits.reduce((s,u) => s + u.size, 0);
                const totArea = state.units.reduce((s,u) => s + u.size, 0);
                const occShare = cost.distributionKey === 'area' ? occArea / totArea : 1;
                const umlageFaehig = cost.amount * occShare;
                vacantCosts += (cost.amount - umlageFaehig);
                occupiedCosts += umlageFaehig;
                
                const tenants = state.tenants.filter(t => {
                    const unit = state.units.find(u => u.id === t.unitId);
                    if (!unit) return false;
                    const d = new Date(cost.date), mi = new Date(t.moveInDate);
                    const mo = t.moveOutDate ? new Date(t.moveOutDate) : null;
                    if (mo && d > mo) return false;
                    if (d < mi) return false;
                    return true;
                });
                
                let tw = 0;
                for (const t of tenants) {
                    const u = state.units.find(x => x.id === t.unitId);
                    if (!u) continue;
                    tw += cost.distributionKey === 'area' ? u.size : 1;
                }
                if (tw === 0) continue;
                
                for (const t of tenants) {
                    const u = state.units.find(x => x.id === t.unitId);
                    if (!u) continue;
                    const w = cost.distributionKey === 'area' ? u.size : 1;
                    const share = w / tw;
                    distributions.push({
                        tenantId: t.id, tenantName: t.name, unitId: u.id, unitName: u.name,
                        category: cost.category, amount: Math.round(umlageFaehig * share * 100) / 100,
                        share: Math.round(share * 10000) / 100,
                    });
                }
            }
            
            const vacantUnits = state.units.filter(u => state.tenants.filter(t => {
                if (t.unitId !== u.id) return false;
                const now = new Date(year + '-12-31'), ys = new Date(year + '-01-01');
                const mi = new Date(t.moveInDate), mo = t.moveOutDate ? new Date(t.moveOutDate) : null;
                if (mo && ys > mo) return false;
                if (mi > now) return false;
                return true;
            }).length === 0);
            
            const byCat = {};
            umlegbar.forEach(c => { byCat[c.category] = (byCat[c.category] || 0) + c.amount; });
            
            return { totalCosts: fc.reduce((s,c) => s + c.amount, 0), umlegbarTotal: umlegbar.reduce((s,c) => s + c.amount, 0), nichtUmlagbar: nichtUmlagbar.reduce((s,c) => s + c.amount, 0), vacantCosts, occupiedCosts, distributions, vacantUnits, costsByCategory: byCat };
        }
        
        function getTenantSettlement(tenantId, year) {
            const result = calculateSettlement(year);
            const tenantDists = result.distributions.filter(d => d.tenantId === tenantId);
            const total = tenantDists.reduce((s,d) => s + d.amount, 0);
            const categories = {};
            tenantDists.forEach(d => { categories[d.category] = (categories[d.category] || 0) + d.amount; });
            const prepayments = calculatePrepayments(tenantId, year);
            return { total, categories, prepayments, balance: prepayments - total };
        }

                        return `<tr ${nu?'style="background:#fef2f2;"':''}><td>${formatDate(c.date)}</td><td><span class="badge ${nu?'badge-red':'badge-blue'}">${cat?.label||c.category}</span>${nu?'<div style="font-size:10px;color:#dc2626;">Nicht umlegbar</div>':''}</td><td>${c.description}</td><td style="font-size:12px;">${ak[c.distributionKey]||c.distributionKey}</td><td class="text-right" style="font-weight:600;">${formatCurrency(c.amount)}</td><td class="text-right"><button class="btn btn-sm btn-secondary" data-edit-cost="${c.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-danger" data-delete-cost="${c.id}"><i class="fas fa-trash"></i></button></td></tr>`;
                    }).join('')}</tbody></table></div>` : '<div class="empty-state"><i class="fas fa-receipt"></i><p>Keine Kosten</p></div>'}
                </div>
            `;
        }
        
        // ============ VERTEILERSCHLÜSSEL ============
        function renderDistKeys() {
            const c = state.customDistKeys || [];
            return `
                <div class="card">
                    <div class="card-header"><div><h2 class="card-title">Verteilerschlüssel</h2></div><button class="btn btn-primary" id="addDistKeyBtn"><i class="fas fa-plus"></i> Neuer Schlüssel</button></div>
                    <h3 style="font-size:14px; font-weight:600; margin-bottom:12px;">Standard-Schlüssel</h3>
                    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:10px; margin-bottom:24px;">
                        ${Object.entries(STANDARD_DIST_KEYS).map(([k,v]) => `<div style="padding:12px; background:#f0f9ff; border-radius:8px; border:1px solid #bfdbfe;"><div style="font-weight:600; font-size:13px; color:#1e40af;">${v}</div></div>`).join('')}
                    </div>
                    <h3 style="font-size:14px; font-weight:600; margin-bottom:12px;">Eigene Schlüssel</h3>
                    ${c.length > 0 ? `<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:10px;">${c.map(k => `<div style="padding:12px; background:#f0fdf4; border-radius:8px; border:1px solid #bbf7d0; display:flex; justify-content:space-between; align-items:center;"><div><div style="font-weight:600; font-size:13px; color:#166534;">${k.name}</div><div style="font-size:11px; color:#6b7280;">${k.description||''}</div></div><button class="btn btn-sm btn-danger" data-delete-dk="${k.id}"><i class="fas fa-trash"></i></button></div>`).join('')}</div>` : '<p style="color:#9ca3af; font-size:13px;">Keine eigenen Schlüssel.</p>'}
                </div>
            `;
        }
        
        // ============ JAHRESWECHSEL ============
        function renderYearEnd() {
            const years = [...new Set(state.costs.map(c => new Date(c.date).getFullYear()))].sort();
            const latestYear = years.length > 0 ? years[years.length-1] : new Date().getFullYear();
            const nextYear = latestYear + 1;
            
            const costsThisYear = state.costs.filter(c => new Date(c.date).getFullYear() === latestYear);
            const costsNextYear = state.costs.filter(c => new Date(c.date).getFullYear() === nextYear);
            
            return `
                <div class="card">
                    <div class="card-header"><div><h2 class="card-title">Jahreswechsel / Datenübernahme</h2><p class="card-subtitle">Daten aus dem Vorjahr übernehmen und anpassen</p></div></div>
                    
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <div>
                            <strong>Stammdaten bleiben erhalten:</strong> Objekt, Wohneinheiten, Mieter und Verteilerschlüssel werden automatisch übernommen. 
                            Sie müssen nur die Daten ändern, die sich geändert haben (z.B. neue Kosten, angepasste Vorauszahlungen).
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-calendar"></i></div><div><div class="stat-value">${latestYear}</div><div class="stat-label">Aktuelles Abrechnungsjahr</div></div></div>
                        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-receipt"></i></div><div><div class="stat-value">${costsThisYear.length}</div><div class="stat-label">Kosten ${latestYear}</div></div></div>
                        <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-arrow-right"></i></div><div><div class="stat-value">${nextYear}</div><div class="stat-label">Nächstes Jahr</div></div></div>
                        <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-copy"></i></div><div><div class="stat-value">${costsNextYear.length}</div><div class="stat-label">Bereits in ${nextYear}</div></div></div>
                    </div>
                    
                    <h3 style="font-size:15px; font-weight:600; margin:20px 0 12px;">Was wird übernommen?</h3>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:12px; margin-bottom:20px;">
                        <div style="padding:14px; background:#f0fdf4; border-radius:8px; border:1px solid #bbf7d0;">
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;"><i class="fas fa-check-circle" style="color:#16a34a;"></i><strong style="color:#166534;">Automatisch übernommen</strong></div>
                            <ul style="font-size:12px; color:#4b5563; margin-left:26px; line-height:1.8;">
                                <li>Objekt-Stammdaten</li>
                                <li>Vermieter/Briefkopf</li>
                                <li>Alle Wohneinheiten</li>
                                <li>Alle Mieter (aktive)</li>
                                <li>Verteilerschlüssel</li>
                                <li>Vorauszahlungen (laufende)</li>
                            </ul>
                        </div>
                        <div style="padding:14px; background:#fefce8; border-radius:8px; border:1px solid #fde047;">
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;"><i class="fas fa-edit" style="color:#a16207;"></i><strong style="color:#854d0e;">Manuell anpassen</strong></div>
                            <ul style="font-size:12px; color:#4b5563; margin-left:26px; line-height:1.8;">
                                <li>Betriebskosten (neue Rechnungen)</li>
                                <li>Vorauszahlungshöhe (falls geändert)</li>
                                <li>Mieterwechsel (Einzug/Auszug)</li>
                                <li>Neue Wohneinheiten</li>
                            </ul>
                        </div>
                    </div>
                    
                    <h3 style="font-size:15px; font-weight:600; margin:20px 0 12px;">Kosten aus Vorjahr übernehmen</h3>
                    <p style="font-size:13px; color:#6b7280; margin-bottom:12px;">Kopiert alle Kostenpositionen aus ${latestYear} nach ${nextYear} (mit neuem Datum). Danach können Sie die Beträge anpassen.</p>
                    
                    <div class="form-grid" style="margin-bottom:16px;">
                        <div class="form-group">
                            <label class="form-label">Quelle (Vorjahr)</label>
                            <select class="form-input" id="copyFromYear">
                                ${years.map(y => `<option value="${y}" ${y === latestYear ? 'selected' : ''}>${y}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ziel (neues Jahr)</label>
                            <input class="form-input" type="number" id="copyToYear" value="${nextYear}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Neues Datum</label>
                            <input class="form-input" type="date" id="copyNewDate" value="${nextYear}-01-01">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button class="btn btn-primary" id="copyCostsYearBtn"><i class="fas fa-copy"></i> Kosten ins neue Jahr kopieren</button>
                        <button class="btn btn-success" id="copyPrepaymentsBtn"><i class="fas fa-copy"></i> Vorauszahlungen prüfen/übernehmen</button>
                    </div>
                    
                    <div class="legal-note" style="margin-top:20px;">
                        <i class="fas fa-lightbulb"></i>
                        <strong>Tipp:</strong> Nach dem Kopieren können Sie die Beträge einfach bearbeiten (z.B. neue Gasrechnung mit aktualisiertem Betrag). 
                        Die Mieter, Einheiten und Schlüssel bleiben unverändert.
                    </div>
                </div>
            `;
        }
        
        // ============ ABRECHNUNG ============
        let settlementYear = new Date().getFullYear().toString();
        
        function renderSettlement() {
            const years = [...new Set(state.costs.map(c => new Date(c.date).getFullYear().toString()))];
            if (!years.length) years.push(new Date().getFullYear().toString());
            years.sort().reverse();
            if (!years.includes(settlementYear)) settlementYear = years[0];
            
            const result = calculateSettlement(settlementYear);
            const tenantTotals = {};
            result.distributions.forEach(d => {
                if (!tenantTotals[d.tenantId]) tenantTotals[d.tenantId] = { name: d.tenantName, unit: d.unitName, categories: {}, total: 0 };
                tenantTotals[d.tenantId].categories[d.category] = (tenantTotals[d.tenantId].categories[d.category] || 0) + d.amount;
                tenantTotals[d.tenantId].total += d.amount;
            });
            Object.keys(tenantTotals).forEach(tId => {
                tenantTotals[tId].prepayments = calculatePrepayments(tId, settlementYear);
                tenantTotals[tId].balance = tenantTotals[tId].prepayments - tenantTotals[tId].total;
            });
            
            const usedCats = Object.keys(result.costsByCategory);
            const totalPrep = Object.values(tenantTotals).reduce((s,t) => s + t.prepayments, 0);
            const totalBal = Object.values(tenantTotals).reduce((s,t) => s + t.balance, 0);
            
            return `
                <div class="card no-print">
                    <div class="card-header"><div><h2 class="card-title">Nebenkostenabrechnung ${settlementYear}</h2><p class="card-subtitle">${state.property?.name||'Objekt'} · 01.01.${settlementYear} – 31.12.${settlementYear}</p></div><div style="display:flex; gap:10px;"><select class="form-input" id="yearSelect">${years.map(y => `<option value="${y}" ${y===settlementYear?'selected':''}>${y}</option>`).join('')}</select><button class="btn btn-purple" id="printAllBtn"><i class="fas fa-print"></i> Alle PDFs</button></div></div>
                </div>
                
                <div class="summary-grid">
                    <div class="summary-card blue"><div class="summary-label">Gesamtkosten</div><div class="summary-value">${formatCurrency(result.totalCosts)}</div></div>
                    <div class="summary-card green"><div class="summary-label">Umlagefähig</div><div class="summary-value">${formatCurrency(result.occupiedCosts)}</div></div>
                    <div class="summary-card amber"><div class="summary-label">Vorauszahlungen</div><div class="summary-value">${formatCurrency(totalPrep)}</div></div>
                    <div class="summary-card ${totalBal>=0?'emerald':'red'}"><div class="summary-label">Saldo gesamt</div><div class="summary-value">${formatCurrency(Math.abs(totalBal))}</div><div class="summary-sub">${totalBal>=0?'Guthaben':'Nachzahlung'}</div></div>
                </div>
                
                ${result.vacantUnits.length > 0 ? `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><div><strong>Leerstandskosten: ${formatCurrency(result.vacantCosts)}</strong><br><span style="font-size:12px;">${result.vacantUnits.map(u=>u.name).join(', ')}</span></div></div>` : ''}
                ${result.nichtUmlagbar > 0 ? `<div class="alert alert-danger"><i class="fas fa-times-circle"></i><div><strong>Nicht umlegbar: ${formatCurrency(result.nichtUmlagbar)}</strong></div></div>` : ''}
                
                ${Object.keys(tenantTotals).length > 0 ? `
                <div class="card">
                    <h3 class="card-title">Einzelabrechnung je Mieter</h3>
                    <div style="overflow-x:auto; margin-top:12px;"><table class="settlement-table"><thead><tr><th>Mieter</th><th>Einheit</th>${usedCats.map(c=>`<th class="text-right">${COST_CATEGORIES[c]?.label||c}</th>`).join('')}<th class="text-right">Kosten</th><th class="text-right">Voraus-zahlung</th><th class="text-right">Saldo</th><th class="text-right no-print">PDF</th></tr></thead><tbody>
                        ${Object.entries(tenantTotals).map(([id, d]) => {
                            const bc = d.balance > 0 ? 'amount-negative' : d.balance < 0 ? 'amount-positive' : 'amount-zero';
                            const bl = d.balance > 0 ? 'Guthaben' : d.balance < 0 ? 'Nachzahlung' : 'Ausgeglichen';
                            return `<tr><td style="font-weight:500;">${d.name}</td><td>${d.unit}</td>${usedCats.map(c=>`<td class="text-right">${d.categories[c]?formatCurrency(d.categories[c]):'—'}</td>`).join('')}<td class="text-right" style="font-weight:600;">${formatCurrency(d.total)}</td><td class="text-right" style="color:#16a34a;">${formatCurrency(d.prepayments)}</td><td class="text-right ${bc}">${formatCurrency(Math.abs(d.balance))}<br><span style="font-size:10px;">${bl}</span></td><td class="text-right no-print"><button class="btn btn-sm btn-purple" data-pdf-tenant="${id}"><i class="fas fa-file-pdf"></i></button></td></tr>`;
                        }).join('')}
                    </tbody><tfoot><tr><td colspan="2">Summe</td>${usedCats.map(c=>`<td class="text-right">${formatCurrency(result.costsByCategory[c]||0)}</td>`).join('')}<td class="text-right" style="color:#2563eb;">${formatCurrency(result.occupiedCosts)}</td><td class="text-right" style="color:#16a34a;">${formatCurrency(totalPrep)}</td><td class="text-right" style="color:${totalBal>=0?'#16a34a':'#dc2626'};">${formatCurrency(Math.abs(totalBal))}</td><td class="no-print"></td></tr></tfoot></table></div>
                </div>` : ''}
            `;
        }
        
        // ============ VERMIETER-PROTOKOLL ============
        function renderProtokoll() {
            const years = [...new Set(state.costs.map(c => new Date(c.date).getFullYear().toString()))];
            if (!years.length) years.push(new Date().getFullYear().toString());
            years.sort().reverse();
            if (!years.includes(settlementYear)) settlementYear = years[0];
            
            const result = calculateSettlement(settlementYear);
            const tenantData = {};
            result.distributions.forEach(d => {
                if (!tenantData[d.tenantId]) tenantData[d.tenantId] = { name: d.tenantName, unit: d.unitName, total: 0 };
                tenantData[d.tenantId].total += d.amount;
            });
            Object.keys(tenantData).forEach(tId => {
                tenantData[tId].prepayments = calculatePrepayments(tId, settlementYear);
                tenantData[tId].balance = tenantData[tId].prepayments - tenantData[tId].total;
            });
            
            const nachzahlung = Object.values(tenantData).filter(t => t.balance < 0);
            const guthaben = Object.values(tenantData).filter(t => t.balance > 0);
            const ausgeglichen = Object.values(tenantData).filter(t => t.balance === 0);
            const totalNach = nachzahlung.reduce((s,t) => s + Math.abs(t.balance), 0);
            const totalGut = guthaben.reduce((s,t) => s + t.balance, 0);
            
            return `
                <div class="card no-print">
                    <div class="card-header"><div><h2 class="card-title">Vermieter-Protokoll ${settlementYear}</h2><p class="card-subtitle">Übersicht über Nachzahlungen und Guthaben</p></div><div style="display:flex; gap:10px;"><select class="form-input" id="protokollYearSelect">${years.map(y => `<option value="${y}" ${y===settlementYear?'selected':''}>${y}</option>`).join('')}</select><button class="btn btn-purple" id="printProtokollBtn"><i class="fas fa-print"></i> Protokoll drucken</button></div></div>
                </div>
                
                <div class="summary-grid">
                    <div class="summary-card red"><div class="summary-label">Nachzahlungen</div><div class="summary-value">${formatCurrency(totalNach)}</div><div class="summary-sub">${nachzahlung.length} Mieter</div></div>
                    <div class="summary-card emerald"><div class="summary-label">Guthaben</div><div class="summary-value">${formatCurrency(totalGut)}</div><div class="summary-sub">${guthaben.length} Mieter</div></div>
                    <div class="summary-card blue"><div class="summary-label">Ausgeglichen</div><div class="summary-value">${ausgeglichen.length}</div><div class="summary-sub">Mieter</div></div>
                </div>
                
                ${nachzahlung.length > 0 ? `
                <div class="card">
                    <h3 class="card-title" style="color:#dc2626;"><i class="fas fa-arrow-down" style="margin-right:8px;"></i>Nachzahlungspflichtige Mieter</h3>
                    <div style="overflow-x:auto; margin-top:12px;"><table><thead><tr><th>Mieter</th><th>Einheit</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Nachzahlung</th></tr></thead><tbody>
                        ${nachzahlung.sort((a,b) => b.balance - a.balance).map(t => `<tr><td style="font-weight:500;">${t.name}</td><td>${t.unit}</td><td class="text-right">${formatCurrency(t.total)}</td><td class="text-right" style="color:#16a34a;">${formatCurrency(t.prepayments)}</td><td class="text-right amount-positive">${formatCurrency(Math.abs(t.balance))}</td></tr>`).join('')}
                    </tbody><tfoot><tr><td colspan="4" style="font-weight:700;">Summe Nachzahlungen</td><td class="text-right" style="font-weight:700; color:#dc2626;">${formatCurrency(totalNach)}</td></tr></tfoot></table></div>
                </div>` : ''}
                
                ${guthaben.length > 0 ? `
                <div class="card">
                    <h3 class="card-title" style="color:#16a34a;"><i class="fas fa-arrow-up" style="margin-right:8px;"></i>Guthaben-Mieter (Rückzahlung)</h3>
                    <div style="overflow-x:auto; margin-top:12px;"><table><thead><tr><th>Mieter</th><th>Einheit</th><th class="text-right">Kosten</th><th class="text-right">Vorauszahlung</th><th class="text-right">Guthaben</th></tr></thead><tbody>
                        ${guthaben.sort((a,b) => b.balance - a.balance).map(t => `<tr><td style="font-weight:500;">${t.name}</td><td>${t.unit}</td><td class="text-right">${formatCurrency(t.total)}</td><td class="text-right" style="color:#16a34a;">${formatCurrency(t.prepayments)}</td><td class="text-right amount-negative">${formatCurrency(t.balance)}</td></tr>`).join('')}
                    </tbody><tfoot><tr><td colspan="4" style="font-weight:700;">Summe Guthaben</td><td class="text-right" style="font-weight:700; color:#16a34a;">${formatCurrency(totalGut)}</td></tr></tfoot></table></div>
                </div>` : ''}
                
                ${ausgeglichen.length > 0 ? `
                <div class="card">
                    <h3 class="card-title" style="color:#6b7280;"><i class="fas fa-check" style="margin-right:8px;"></i>Ausgeglichene Mieter</h3>
                    <div style="margin-top:12px;">${ausgeglichen.map(t => `<div style="display:flex; justify-content:space-between; padding:8px 12px; background:#f9fafb; border-radius:6px; margin-bottom:4px;"><span style="font-weight:500;">${t.name}</span><span style="color:#6b7280;">${t.unit} · ${formatCurrency(t.total)}</span></div>`).join('')}</div>
                </div>` : ''}
                
                <div class="card">
                    <h3 class="card-title">Gesamtübersicht</h3>
                    <div style="margin-top:12px; display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
                        <div style="padding:14px; background:#eff6ff; border-radius:8px;"><div style="font-size:12px; color:#6b7280;">Gesamtkosten</div><div style="font-weight:700; font-size:18px; color:#1e40af;">${formatCurrency(result.occupiedCosts)}</div></div>
                        <div style="padding:14px; background:#f0fdf4; border-radius:8px;"><div style="font-size:12px; color:#6b7280;">Vorauszahlungen</div><div style="font-weight:700; font-size:18px; color:#166534;">${formatCurrency(Object.values(tenantData).reduce((s,t)=>s+t.prepayments,0))}</div></div>
                        <div style="padding:14px; background:#fef2f2; border-radius:8px;"><div style="font-size:12px; color:#6b7280;">Vermieteranteil</div><div style="font-weight:700; font-size:18px; color:#991b1b;">${formatCurrency(result.vacantCosts + result.nichtUmlagbar)}</div></div>
                    </div>
                </div>
            `;
        }
        
        // ============ PDF ANSICHT ============
        function renderPdfView() {
            if (pdfView.type === 'tenant') return renderTenantPdf(pdfView.tenantId, pdfView.year);
            if (pdfView.type === 'protokoll') return renderProtokollPdf(pdfView.year);
            if (pdfView.type === 'all') return renderAllTenantPdfs(pdfView.year);
            return '';
        }
        
        function getLetterhead() {
            const p = state.property;
            if (!p) return { sender: 'Vermieter', senderHtml: '', footerHtml: '' };
            const senderLines = [p.owner || '', p.ownerAdd || '', p.ownerAddress || ''].filter(Boolean);
            const footerLines = [
                p.phone ? 'Tel: ' + p.phone : '',
                p.email || '',
                p.bankName ? p.bankName : '',
                p.bank ? 'IBAN: ' + p.bank : '',
                p.taxId ? 'St.-Nr: ' + p.taxId : '',
            ].filter(Boolean);
            return {
                sender: senderLines.join(', '),
                senderHtml: `<div class="pdf-letterhead-sender"><strong>${p.owner || 'Vermieter'}</strong>${p.ownerAdd ? '<br>'+p.ownerAdd : ''}<br>${p.ownerAddress || ''}</div>`,
                footerHtml: footerLines.join(' | '),
            };
        }
        
        function renderTenantPdf(tenantId, year) {
            const tenant = state.tenants.find(t => t.id === tenantId);
            if (!tenant) return '';
            const unit = state.units.find(u => u.id === tenant.unitId);
            const settlement = getTenantSettlement(tenantId, year);
            const result = calculateSettlement(year);
            const lh = getLetterhead();
            const usedCats = Object.keys(result.costsByCategory);
            const bc = settlement.balance > 0 ? 'guthaben' : settlement.balance < 0 ? 'nachzahlung' : 'ausgeglichen';
            const bl = settlement.balance > 0 ? 'Guthaben' : settlement.balance < 0 ? 'Nachzahlung' : 'Ausgeglichen';
            const p = state.property;
            
            return `
                <div class="no-print" style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <h3 style="font-size:18px; font-weight:700;">PDF-Vorschau: ${tenant.name}</h3>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-purple" onclick="window.print()"><i class="fas fa-print"></i> Drucken / PDF</button>
                        <button class="btn btn-secondary" onclick="pdfView=null; render()"><i class="fas fa-times"></i> Schließen</button>
                    </div>
                </div>
                <div class="pdf-page">
                    <div class="pdf-letterhead">
                        ${lh.senderHtml}
                        <div class="pdf-letterhead-logo"><h1>${p?.name || 'Objekt'}</h1><p>${p?.address || ''}</p></div>
                    </div>
                    <div class="pdf-recipient">
                        <p><strong>${tenant.name}</strong><br>${unit?.name || ''}<br>${p?.address || ''}</p>
                    </div>
                    <div class="pdf-date">${p?.ownerAddress || p?.address || ''}, den ${new Date().toLocaleDateString('de-DE')}</div>
                    <div class="pdf-subject">Nebenkostenabrechnung für den Zeitraum 01.01.${year} – 31.12.${year}</div>
                    <p style="margin-bottom:20px; font-size:10pt;">Sehr geehrte(r) ${tenant.name.split(' ').pop() || 'Mieter/in'},<br>anbei erhalten Sie die Nebenkostenabrechnung für das Jahr ${year}.</p>
                    
                    <div class="pdf-section">
                        <h2>A. Umlegbare Betriebskosten</h2>
                        <table class="pdf-table">

            render();
            document.getElementById('saveBtn').onclick = () => {
                const name = document.getElementById('f1').value.trim();
                if (!name) return alert('Name eingeben.');
                if (!state.customDistKeys) state.customDistKeys = [];
                state.customDistKeys.push({ id: generateId(), name, basis: document.getElementById('f2').value.trim(), description: document.getElementById('f3').value.trim() });
                saveData(state); closeModal();
            };
        }
        
        // ============ EVENTS ============
        function attachEvents() {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.onclick = () => { activeTab = btn.dataset.tab; pdfView = null; render(); });
            const tb = document.getElementById('toggleSidebar');
            if (tb) tb.onclick = () => { sidebarCollapsed = !sidebarCollapsed; render(); };
            const mo = document.getElementById('modalOverlay');
            if (mo) mo.onclick = e => { if (e.target === mo) closeModal(); };
            
            // Property
            const sp = document.getElementById('savePropertyBtn');
            if (sp) sp.onclick = () => {
                if (!state.property) state.property = {};
                const tab = window._propTab || 'objekt';
                if (tab === 'objekt') {
                    state.property.name = document.getElementById('propName').value.trim();
                    state.property.yearBuilt = document.getElementById('propYear').value;
                    state.property.address = document.getElementById('propAddress').value.trim();
                    state.property.landArea = document.getElementById('propLandArea').value;
                    state.property.landRegistry = document.getElementById('propLandRegistry').value.trim();
                    state.property.notes = document.getElementById('propNotes').value.trim();
                } else {
                    state.property.owner = document.getElementById('propOwner').value.trim();
                    state.property.ownerAdd = document.getElementById('propOwnerAdd').value.trim();
                    state.property.ownerAddress = document.getElementById('propOwnerAddress').value.trim();
                    state.property.phone = document.getElementById('propPhone').value.trim();
                    state.property.email = document.getElementById('propEmail').value.trim();
                    state.property.taxId = document.getElementById('propTaxId').value.trim();
                    state.property.bank = document.getElementById('propBank').value.trim();
                    state.property.bankName = document.getElementById('propBankName').value.trim();
                }
                if (!state.property.name || !state.property.address) return alert('Objektbezeichnung und Adresse sind Pflicht.');
                saveData(state); render(); alert('Gespeichert!');
            };
            
            // Units
            const au = document.getElementById('addUnitBtn');
            if (au) au.onclick = () => showUnitForm(null);
            document.querySelectorAll('[data-edit-unit]').forEach(b => b.onclick = () => showUnitForm(b.dataset.editUnit));
            document.querySelectorAll('[data-delete-unit]').forEach(b => b.onclick = () => { if (confirm('Einheit löschen?')) { state.units = state.units.filter(u=>u.id!==b.dataset.deleteUnit); state.tenants = state.tenants.filter(t=>t.unitId!==b.dataset.deleteUnit); saveData(state); render(); }});
            
            // Tenants
            const at = document.getElementById('addTenantBtn');
            if (at && state.units.length > 0) at.onclick = () => showTenantForm(null);
            document.querySelectorAll('[data-edit-tenant]').forEach(b => b.onclick = () => showTenantForm(b.dataset.editTenant));
            document.querySelectorAll('[data-delete-tenant]').forEach(b => b.onclick = () => { if (confirm('Mieter löschen?')) { state.tenants = state.tenants.filter(t=>t.id!==b.dataset.deleteTenant); saveData(state); render(); }});
            
            // Prepayments
            const ap = document.getElementById('addPrepayBtn');
            if (ap && state.tenants.length > 0) ap.onclick = () => showPrepayForm(null);
            document.querySelectorAll('[data-edit-prepay]').forEach(b => b.onclick = () => showPrepayForm(b.dataset.editPrepay));
            document.querySelectorAll('[data-delete-prepay]').forEach(b => b.onclick = () => { if (confirm('Löschen?')) { state.prepayments = state.prepayments.filter(p=>p.id!==b.dataset.deletePrepay); saveData(state); render(); }});
            
            // Costs
            const ac = document.getElementById('addCostBtn');
            if (ac) ac.onclick = () => showCostForm(null);
            document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { costFilter = b.dataset.filter; render(); });
            document.querySelectorAll('[data-edit-cost]').forEach(b => b.onclick = () => showCostForm(b.dataset.editCost));
            document.querySelectorAll('[data-delete-cost]').forEach(b => b.onclick = () => { if (confirm('Löschen?')) { state.costs = state.costs.filter(c=>c.id!==b.dataset.deleteCost); saveData(state); render(); }});
            
            // Copy costs
            const cc = document.getElementById('copyCostsBtn');
            if (cc) cc.onclick = () => {
                const years = [...new Set(state.costs.map(c => new Date(c.date).getFullYear()))].sort();
                if (years.length === 0) return alert('Keine Kosten zum Kopieren vorhanden.');
                const fromYear = years[years.length-1];
                const toYear = fromYear + 1;
                const newDate = toYear + '-01-01';
                const source = state.costs.filter(c => new Date(c.date).getFullYear() === fromYear);
                if (source.length === 0) return alert('Keine Kosten im Jahr ' + fromYear);
                if (!confirm(`${source.length} Kostenpositionen aus ${fromYear} nach ${toYear} kopieren?`)) return;
                source.forEach(c => {
                    state.costs.push({ id: generateId(), category: c.category, description: c.description, amount: c.amount, date: newDate, distributionKey: c.distributionKey, invoiceNo: '' });
                });
                saveData(state); render();
                alert(`${source.length} Kostenpositionen nach ${toYear} kopiert! Beträge können Sie jetzt anpassen.`);
            };
            
            // Year end copy
            const ccy = document.getElementById('copyCostsYearBtn');
            if (ccy) ccy.onclick = () => {
                const fromYear = document.getElementById('copyFromYear').value;
                const toYear = document.getElementById('copyToYear').value;
                const newDate = document.getElementById('copyNewDate').value;
                const source = state.costs.filter(c => new Date(c.date).getFullYear().toString() === fromYear);
                if (source.length === 0) return alert('Keine Kosten im Jahr ' + fromYear);
                if (!confirm(`${source.length} Kosten aus ${fromYear} nach ${toYear} kopieren?`)) return;
                source.forEach(c => {
                    state.costs.push({ id: generateId(), category: c.category, description: c.description, amount: c.amount, date: newDate, distributionKey: c.distributionKey, invoiceNo: '' });
                });
                saveData(state); render();
                alert(`${source.length} Kosten nach ${toYear} kopiert!`);
            };
            
            const cpb = document.getElementById('copyPrepaymentsBtn');
            if (cpb) cpb.onclick = () => {
                alert('Vorauszahlungen werden automatisch übernommen! Laufende Vorauszahlungen (ohne Enddatum) gelten auch für das neue Jahr. Sie können diese unter "Vorauszahlungen" bearbeiten.');
            };
            
            // Dist Keys
            const adk = document.getElementById('addDistKeyBtn');
            if (adk) adk.onclick = () => showDistKeyForm();
            document.querySelectorAll('[data-delete-dk]').forEach(b => b.onclick = () => { state.customDistKeys = (state.customDistKeys||[]).filter(k=>k.id!==b.dataset.deleteDk); saveData(state); render(); });
            
            // Settlement
            const ys = document.getElementById('yearSelect');
            if (ys) ys.onchange = () => { settlementYear = ys.value; pdfView = null; render(); };
            const pa = document.getElementById('printAllBtn');
            if (pa) pa.onclick = () => { pdfView = { type: 'all', year: settlementYear }; render(); setTimeout(() => window.scrollTo(0,0), 100); };
            document.querySelectorAll('[data-pdf-tenant]').forEach(b => b.onclick = () => { pdfView = { type: 'tenant', tenantId: b.dataset.pdfTenant, year: settlementYear }; render(); setTimeout(() => window.scrollTo(0,0), 100); });
            
            // Protokoll
            const pys = document.getElementById('protokollYearSelect');
            if (pys) pys.onchange = () => { settlementYear = pys.value; render(); };
            const ppb = document.getElementById('printProtokollBtn');
            if (ppb) ppb.onclick = () => { pdfView = { type: 'protokoll', year: settlementYear }; render(); setTimeout(() => window.scrollTo(0,0), 100); };
        }
        
        render();
    </script>
</body>
</html>
