[package]
name = "nebenkosten-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI Framework
eframe = "0.27"
egui = "0.27"

# Datenverarbeitung
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Datenbank
rusqlite = { version = "0.31", features = ["bundled"] }

# Fehlerbehandlung
anyhow = "1.0"
thiserror = "1.0"

# Verzeichnispfade
dirs = "5.0"
