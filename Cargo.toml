[package]
name = "nebenkosten"
version = "1.0.0"
edition = "2021"
authors = ["Dein Name"]
description = "Nebenkostenabrechnungs-Software für Vermieter"
license = "MIT"

[dependencies]
# CLI und TUI
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.25"

# Datenverarbeitung
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Datenbank
rusqlite = { version = "0.30", features = ["bundled"] }

# PDF-Generierung
printpdf = "0.7"

# Fehlerbehandlung
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# CSV-Export
csv = "1.3"

# UUID für eindeutige IDs
uuid = { version = "1.6", features = ["v4"] }

# Verzeichnispfade
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
