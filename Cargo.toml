[package]
name = "nebenkosten"
version = "1.0.0"
edition = "2021"
authors = ["Dein Name"]
description = "Nebenkostenabrechnungs-Software für Vermieter"
license = "MIT"

[dependencies]
# Datenverarbeitung
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Datenbank
rusqlite = { version = "0.30", features = ["bundled"] }

# PDF-Generierung
printpdf = "0.7"

# CSV-Export
csv = "1.3"

# Verzeichnispfade
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
